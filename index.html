<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planificador Académico PUPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#ffffff; --soft:#f5f7f9; --ink:#1c2a39; --muted:#5d6a77; --line:#e3e8ec;
  --accent:#7b1e2b; --accent-ink:#ffffff; --accent-soft:#f7eced; --ok:#2f6b4f; --ip:#2c5d8a; --warn:#9a5b00; --danger:#a3262f;
  --bar-pend:#e6eaee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b22; --soft:#1c242d; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2c3743;
    --accent:#e0939c; --accent-ink:#151b22; --accent-soft:#2a1f24; --ok:#7fc3a0; --ip:#8db8e0; --warn:#e2b25c; --danger:#ef8a91; --bar-pend:#2c3743;
  }
}
:root[data-theme="dark"]{
  --paper:#151b22; --soft:#1c242d; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2c3743;
  --accent:#e0939c; --accent-ink:#151b22; --accent-soft:#2a1f24; --ok:#7fc3a0; --ip:#8db8e0; --warn:#e2b25c; --danger:#ef8a91; --bar-pend:#2c3743;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 72px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{font-weight:600;font-size:14px;color:var(--muted)}
.brand b{color:var(--ink);font-weight:600}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn.link{border:none;background:none;color:var(--accent);padding:2px 4px}
.btn.link:hover{text-decoration:underline;background:none}
.btn.danger{color:var(--danger)}
.btn.sm{font-size:13px;padding:5px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
select,input,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Estudiante */
.student{padding:8px 0 24px}
.name{font:inherit;font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.2;border:1px solid transparent;border-radius:8px;padding:2px 8px;margin:0 -9px;width:calc(100% + 18px);background:none}
.name:hover{border-color:var(--line)}
.name:focus{border-color:var(--accent);outline:none}
.name::placeholder{color:var(--muted);opacity:.7}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:8px;color:var(--muted);font-size:14px}
.meta select{font-size:14px;padding:5px 8px;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 18px}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:2px 0 0;font-size:24px;font-weight:600;line-height:1.25}
.facts dd small{font-size:13px;font-weight:400;color:var(--muted)}
.progress .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bar-pend)}
.progress .bar i{display:block;height:100%}
.progress .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Pestañas */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs [role=tab]{font:inherit;font-size:15px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;padding:10px 0;margin-bottom:-1px;color:var(--muted);cursor:pointer}
.tabs [role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

/* Menú */
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,25,35,.14);padding:6px;min-width:220px;z-index:20;display:none}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:none;border-radius:6px;padding:9px 12px;color:var(--ink);cursor:pointer}
.menu-list button:hover{background:var(--soft)}
.menu-list hr{border:none;border-top:1px solid var(--line);margin:4px 0}

/* Avisos */
.notice{background:var(--soft);padding:10px 14px;margin:0 0 14px;font-size:14px;border-radius:8px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;border-left:3px solid var(--warn)}
.notice.info{border-left-color:var(--ip)}
.notice.bad{border-left-color:var(--danger);display:block}
.notice ul{margin:6px 0 0;padding-left:20px}

/* Tablas de cursos */
.ctable{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}
.ctable th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line)}
.ctable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.ctable .code{font-weight:600;white-space:nowrap}
.ctable .cr,.ctable th.cr{text-align:right}
.ctable .pre{color:var(--muted);font-size:13px}
.ctable .act{text-align:right}
.ctable tr.excluded td{color:var(--muted)}
.ctable tr.excluded td.code{font-weight:500}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:9px;background:var(--soft);color:var(--muted);white-space:nowrap;margin-left:4px;vertical-align:1px}
.g-done{color:var(--ok);font-weight:600}
.g-ip{color:var(--ip);font-weight:600}
.g-fail{color:var(--danger);font-weight:600}

/* Términos */
.term{margin:0 0 28px}
.term-head{display:flex;align-items:baseline;gap:10px;padding-bottom:8px}
.term-head h3{margin:0;font-size:16px;font-weight:600}
.term-head .tcr{margin-left:auto;color:var(--muted);font-size:14px}
.term-head .flag{font-size:12.5px;color:var(--warn)}
.term-head .flag.bad{color:var(--danger)}
.term .ctable{border-top:2px solid var(--ink)}
.editing .term .ctable{border-top-color:var(--accent)}
.term .add{margin-top:6px}
.editbar{position:sticky;top:0;z-index:10;background:var(--accent-soft);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}

/* GPA */
.gpa-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.gpa-cmp .k{display:block;font-size:13px;color:var(--muted)}
.gpa-cmp .v{display:block;font-size:24px;font-weight:600}
.gpa-cmp input{width:110px;font-size:20px;font-weight:600;padding:4px 8px}
.diff-bad{color:var(--danger)}
.diff-ok{color:var(--ok)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 12px}
.rules label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.formula{font-size:14px;margin:0 0 6px}
.verdict{font-size:14px;margin:0 0 10px}
details.more>summary{cursor:pointer;font-size:13px;color:var(--accent);margin:4px 0 12px}
table.plain{border-collapse:collapse;width:100%;font-size:13.5px}
table.plain th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.plain td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.plain .num{text-align:right}
tr.match td{background:color-mix(in srgb,var(--ok) 12%,transparent)}
h4.sec{font-size:15px;font-weight:600;margin:26px 0 8px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--paper);color:var(--ink);border-radius:12px;max-width:720px;width:100%;max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.narrow{max-width:460px}
.modal header{padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:17px}
.modal .mbody{padding:6px 20px 16px;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal footer .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.field input,.field select{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.checklist label.dis{opacity:.55}
.pdfpage{display:block;max-width:100%;margin:0 auto 12px;border:1px solid var(--line)}
pre.raw{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:12px;border-radius:8px;max-height:60vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%}
.empty{padding:28px 0 12px}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{max-width:58ch;margin:0 0 14px;color:var(--muted)}
.steps{list-style:none;padding:0;margin:0 0 18px;max-width:560px}
.steps li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-size:13px;flex:none}
.steps li.done b{background:var(--ok);color:var(--paper)}
.hidden{display:none!important}

@media (max-width:680px){
  .wrap{padding:0 16px 64px}
  header.top{flex-wrap:nowrap}
  header.top .brand{white-space:nowrap;font-size:13px}
  header.top .btn{padding:6px 6px;font-size:12.5px}
  header.top .row{flex-wrap:nowrap;gap:2px}
  .editbar .hint{display:none}
  .menu-list{left:0;right:auto}
  .name{font-size:24px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .facts dd{font-size:20px}
  .gpa-cmp,.rules,.grid2{grid-template-columns:1fr}
  .toolbar .btn{flex:1 1 auto}
  /* Cursos apilados en móvil */
  .ctable,.ctable tbody{display:block}
  .ctable thead,.ctable colgroup{display:none}
  .ctable tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"code desc cr" "code pre st";gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .editing .ctable tr,.ctable.hist tr{grid-template-columns:auto 1fr auto auto;grid-template-areas:"code desc cr act" "code pre st act"}
  .ctable td{display:block;border:none;padding:0}
  .ctable td.code{grid-area:code;min-width:78px}
  .ctable td.desc{grid-area:desc}
  .ctable td.cr{grid-area:cr}
  .ctable td.st{grid-area:st;text-align:right}
  .ctable td.pre{grid-area:pre}
  .ctable td.act{grid-area:act;align-self:center}
  .ctable td.term-col{display:none}
  .ctable td.pts{display:none}
  .ctable td.st:empty{display:none}
  .term .ctable{border-top-width:2px}
}

/* Número de estudiante */
.stid{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
.stid input{font-size:14px;padding:4px 8px;width:160px;color:var(--ink)}
/* GPA editable en el encabezado */
.gpa-inline{font:inherit;font-size:24px;font-weight:600;width:96px;padding:0 4px;margin-left:-5px;border:1px solid transparent;border-radius:6px;background:none;color:var(--ink)}
.gpa-inline:hover{border-color:var(--line)} .gpa-inline:focus{border-color:var(--accent);outline:none}
@media (max-width:680px){ .gpa-inline{font-size:20px} }
/* Carga por término */
.loadbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;margin:0 0 12px;padding:10px 12px;background:var(--soft);border-radius:8px}
.loadbar label{display:flex;gap:6px;align-items:center}
.loadbar select{padding:4px 8px;font-size:14px}
/* Probatoria */
.probadge{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px}
.probadge.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.probadge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
/* Prerrequisitos a color */
.pq{font-weight:600}
.pq-done{color:#14532d} .pq-ip{color:#1e3a8a} .pq-pend{color:#9a3412}
.pq-legend{margin:0 0 12px}
.pq-legend .pq{margin-left:6px}
/* Tipos de electiva */
.tag.k-libre{background:color-mix(in srgb,var(--ip) 16%,transparent);color:var(--ip)}
.tag.k-tec{background:color-mix(in srgb,#7a4fb5 16%,transparent);color:#7a4fb5}
.tag.k-sohu{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
table.sh .tag{font-size:9.5px;padding:0 5px;margin-left:2px}
/* Alertas */
details.alerts{border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:8px;padding:10px 14px;margin:0 0 16px;background:var(--paper)}
details.alerts summary{cursor:pointer;font-size:14px}
details.alerts ul{margin:8px 0 0;padding-left:18px;font-size:14px}
details.alerts li{margin:3px 0}
.al-bad::marker{color:var(--danger)} .al-warn::marker{color:var(--warn)}
/* Lista de estudiantes */
.strow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stinfo{min-width:0}
/* Vista del currículo como hoja */
.modal.wide{max-width:1000px}
.modal.sheetm .mbody{padding:0;display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0}
.modal.sheetm{height:calc(100% - 32px)}
.sheetwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.zoombar{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.zoombar .zv{min-width:42px;text-align:center;font-size:13px;color:var(--muted)}
.sheet-vp{flex:1;overflow:auto;background:var(--soft);padding:14px;min-height:0}
.sheet-sc{position:relative;margin:0 auto}
.sheet{position:absolute;left:0;top:0;width:900px;transform-origin:0 0;background:#fff;color:#1c2a39;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.08);padding:26px 28px 30px;font-size:12px;line-height:1.3}
.sh-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.sh-uni{font-size:11px;color:#5d6a77}
.sh-title{font-size:17px;font-weight:700;margin:2px 0 6px}
.sh-meta{display:flex;gap:18px;font-size:12px;color:#3b4855}
.sh-legend{display:grid;grid-template-columns:auto auto;gap:4px 6px}
.lg{font-size:11px;padding:2px 8px;border-radius:3px;border-left:3px solid transparent}
table.sh{border-collapse:collapse;width:100%;table-layout:fixed;border:1px solid #c9d1d8}
table.sh th,table.sh td{border:1px solid #dde3e8;padding:3px 6px;vertical-align:middle;overflow-wrap:anywhere}
table.sh thead th{background:#1c2a39;color:#fff;font-weight:600;font-size:11.5px;text-align:left;padding:5px 6px;border-color:#1c2a39}
table.sh .c{text-align:center}
table.sh th.sec{background:#eef1f4;text-align:left;vertical-align:middle;font-weight:600;font-size:11.5px;border-color:#c9d1d8}
table.sh th.sec small{display:block;font-weight:400;color:#5d6a77;margin-top:4px;font-size:10.5px}
table.sh tbody.sh-sec{border-top:2px solid #9aa6b2}
table.sh td.cd{font-weight:600;white-space:nowrap}
table.sh td.tt em{font-style:normal;font-size:10px;color:#5d6a77;background:#eef1f4;padding:0 4px;border-radius:3px}
table.sh td.pr{font-size:11px;color:#5d6a77}
table.sh .rq.met{color:#2f6b4f;font-weight:600}
table.sh .nt{font-style:italic}
table.sh select,table.sh input{font:inherit;font-size:12px;color:inherit;border:1px solid transparent;background:transparent;border-radius:3px;padding:2px 3px;width:100%}
table.sh select{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;font-weight:700;cursor:pointer;background:#f6f8fa;border-color:#e3e8ec}
table.sh select:hover,table.sh input:not(:disabled):hover{border-color:#9aa6b2}
table.sh select:focus,table.sh input:focus{outline:2px solid #7b1e2b;outline-offset:0}
table.sh input:disabled{cursor:default}
table.sh tr.addrow td{background:#fafbfc}
table.sh tr.slotrow td.cd select{appearance:auto;-webkit-appearance:auto;text-align:left;text-align-last:left;font-weight:600;background:#fff;border-color:#9aa6b2;font-size:11px}
table.sh tr.empty-slot td{background:#fbfcfd}
table.sh tr.optrow td{background:#fafbfc;text-align:left}
table.sh tr.sohu-slot input{border-color:#9aa6b2;background:#fff}
table.sh em{font-style:normal;font-size:10px;color:#5d6a77}
table.sh tr.addrow input{border-color:#dde3e8;background:#fff}
.s-ok td,.lg.s-ok{background:#e7f2ec}.s-ok .gr select{color:#2f6b4f;background:#d3e8dc}.lg.s-ok{border-left-color:#2f6b4f}
.s-fail td,.lg.s-fail{background:#f8e6e7}.s-fail .gr select{color:#a3262f;background:#f0cfd2}.lg.s-fail{border-left-color:#a3262f}
.s-ip td,.lg.s-ip{background:#e6eef6}.s-ip .gr select{color:#2c5d8a;background:#cfdeec}.lg.s-ip{border-left-color:#2c5d8a}
.s-inc td,.lg.s-inc{background:#fbf0de}.s-inc .gr select{color:#9a5b00;background:#f3dfbd}.lg.s-inc{border-left-color:#9a5b00}
table.sh-tot{border-collapse:collapse;margin:16px 0 0 auto;font-size:12px;min-width:320px}
table.sh-tot td{padding:4px 8px;border-bottom:1px solid #dde3e8}
table.sh-tot td:last-child{text-align:right;font-weight:600}
table.sh-tot tr.b td{font-weight:700;border-bottom:2px solid #1c2a39}
@media (max-width:680px){
  .modal.sheetm{max-width:none;height:100%;max-height:100%;border-radius:0}
  .overlay.sheeto{padding:0}
  .sheet-vp{padding:8px}
  .zoombar .small{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Planificador</b> PUPR</div>
    <div class="row">
      <button class="btn ghost" data-action="students">Estudiantes</button>
      <button class="btn ghost" data-action="open-settings">Ajustes</button>
      <button class="btn ghost danger" data-action="clear-all">Borrar</button>
    </div>
  </header>
  <section class="student" id="student"></section>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Secciones"></nav>
  <main id="panel" role="tabpanel"></main>
</div>
<input type="file" id="fileTranscript" accept=".pdf,.txt,.csv,.xlsx,.xlsm,.xls,text/plain,application/pdf" class="hidden">
<input type="file" id="fileAudit" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden">
<input type="file" id="fileCurriculum" accept=".pdf,.txt,.csv,text/plain,application/pdf" class="hidden">

<script>
/* ============================================================
   CORE — lógica pura, sin DOM. Cuatro dominios separados:
   1) Datos del estudiante (transcript)   -> TranscriptParser
   2) Reglas del currículo                 -> CurriculumParser
   3) Reglas del GPA                       -> GPAEngine
   4) Reglas del planificador              -> Planner / Validator
   ============================================================ */
var Core = (function () {
  'use strict';

  /* ---------- Utilidades ---------- */
  var CODE_RE = /([A-Z]{2,5})\s*-?\s*(\d{4}[A-Z]?)/;
  function normCode(s) {
    var up = String(s || '').toUpperCase();
    var m = up.match(CODE_RE);
    return m ? m[1] + ' ' + m[2] : up.trim();
  }
  function isCourseCode(s) { return CODE_RE.test(String(s || '').toUpperCase()); }
  function num(x) { var n = parseFloat(String(x).replace(',', '.')); return isNaN(n) ? 0 : n; }
  function sum(arr, f) { return arr.reduce(function (a, x) { return a + (f ? f(x) : x); }, 0); }
  var uidN = 0;
  function uid() { uidN += 1; return 'u' + Date.now().toString(36) + uidN; }

  /* ============================================================
     CICLO ACADÉMICO
     Fall Y → Winter Y → Spring Y+1 → Summer Y+1 → Fall Y+1
     ============================================================ */
  var SEASON_ABBR = { Fall: 'FA', Winter: 'WI', Spring: 'SP', Summer: 'SU' };
  var Terms = {
    next: function (t, includeSummer) {
      if (t.season === 'Fall') return { season: 'Winter', year: t.year };
      if (t.season === 'Winter') return { season: 'Spring', year: t.year + 1 };
      if (t.season === 'Spring') return includeSummer ? { season: 'Summer', year: t.year } : { season: 'Fall', year: t.year };
      return { season: 'Fall', year: t.year };
    },
    label: function (t) { return (SEASON_ABBR[t.season] || t.season) + ' ' + t.year; },
    /** Acepta "Fall 2026", "FA 2026", "FA26", "fa-26"… y devuelve {season, year} o null. */
    parse: function (str) {
      var m = String(str || '').toUpperCase().trim().match(/^(FALL|FA|WINTER|WI|SPRING|SP|SUMMER|SU|OTO[ÑN]O|INVIERNO|PRIMAVERA|VERANO)\s*[-\/]?\s*((?:19|20)?\d{2})$/);
      if (!m) return null;
      var map = { FALL: 'Fall', FA: 'Fall', 'OTOÑO': 'Fall', OTONO: 'Fall', WINTER: 'Winter', WI: 'Winter', INVIERNO: 'Winter',
        SPRING: 'Spring', SP: 'Spring', PRIMAVERA: 'Spring', SUMMER: 'Summer', SU: 'Summer', VERANO: 'Summer' };
      return { season: map[m[1]], year: +(m[2].length === 2 ? '20' + m[2] : m[2]) };
    },
    /** Forma abreviada para mostrar: "FA 2026". Si no se reconoce, se deja como está. */
    short: function (str) { var p = Terms.parse(str); return p ? Terms.label(p) : String(str == null ? '' : str); },
    sequence: function (start, n, includeSummer) {
      var out = [], t = { season: start.season, year: start.year };
      for (var i = 0; i < n; i++) { out.push(t); t = Terms.next(t, includeSummer); }
      return out;
    }
  };

  /* ============================================================
     REGLAS DEL GPA (configurables)
     ============================================================ */
  var DEFAULT_GPA_RULES = {
    scale: { A: 4, B: 3, C: 2, D: 1, F: 0 },
    repeatPolicy: 'highest',   // highest | latest | all
    wfPolicy: 'asF',           // WF cuenta como F (confirmado con transcript oficial: suma horas GPA con 0 puntos)
    includePrep: true,         // ¿los preparatorios (0xxx) entran al GPA?
    prepPattern: '^[A-Z]{2,5} 0\\d{3}'
  };
  var ALL_GRADES = ['A', 'B', 'C', 'D', 'F', 'T', 'CE', 'P', 'NP', 'IF', 'ID', 'IC', 'W', 'WF', 'IP'];

  function gradeInfo(g, rules) {
    g = String(g || '').toUpperCase().trim();
    if (Object.prototype.hasOwnProperty.call(rules.scale, g))
      return { gpa: true, pts: rules.scale[g], approved: g !== 'F', kind: 'letter' };
    if (g === 'WF') return rules.wfPolicy === 'asF'
      ? { gpa: true, pts: 0, approved: false, kind: 'wf' }
      : { gpa: false, approved: false, kind: 'wf' };
    if (g === 'T' || g === 'CE' || g === 'P') return { gpa: false, approved: true, kind: 'nogpa-pass' };
    if (g === 'IF' || g === 'ID' || g === 'IC') return { gpa: false, approved: false, kind: 'incomplete' };
    if (g === 'W') return { gpa: false, approved: false, kind: 'w' };
    if (g === 'NP') return { gpa: false, approved: false, kind: 'np' };
    if (g === 'IP') return { gpa: false, approved: false, kind: 'ip' };
    return { gpa: false, approved: false, kind: 'unknown' };
  }

  function isPrepCode(code, rules, curriculumType) {
    if (curriculumType === 'PREP') return true;
    // Si el curso está en el currículo, manda su tipo (p. ej. ARCC 0170 de Product Design no es preparatorio).
    if (curriculumType) return false;
    try { return new RegExp(rules.prepPattern).test(code); } catch (e) { return false; }
  }

  /**
   * GPA ponderado por créditos. Devuelve el total y un desglose por fila
   * con la razón de inclusión/exclusión, para poder auditar el resultado.
   */
  function computeGPA(records, rules, prepTypeOf) {
    rules = rules || DEFAULT_GPA_RULES;
    prepTypeOf = prepTypeOf || function () { return null; };
    var rows = records.map(function (r, i) {
      return { ref: r, code: normCode(r.code), credits: num(r.credits), grade: String(r.grade || '').toUpperCase().trim(),
        order: r.order != null ? r.order : i, counts: false, points: 0, reason: '' };
    });
    var groups = {};
    rows.forEach(function (row) { (groups[row.code] = groups[row.code] || []).push(row); });

    Object.keys(groups).forEach(function (code) {
      var g = groups[code];
      var prep = isPrepCode(code, rules, prepTypeOf(code));
      var gpaAttempts = [];
      g.forEach(function (row) {
        var info = gradeInfo(row.grade, rules);
        row.info = info;
        if (!info.gpa) {
          row.reason = {
            'nogpa-pass': 'Crédito aprobado sin valor de GPA',
            incomplete: 'Incompleto: sin valor de GPA',
            w: 'W: no cuenta para GPA',
            np: 'NP (no aprobado, sin valor de GPA)',
            wf: 'WF: excluido (regla configurable)',
            ip: 'En progreso',
            unknown: 'Nota no reconocida'
          }[info.kind];
          return;
        }
        if (prep && !rules.includePrep) { row.reason = 'Preparatorio excluido del GPA (configurable)'; return; }
        gpaAttempts.push(row);
      });
      if (!gpaAttempts.length) return;
      var chosen;
      var flagged = g.some(function (row) { return row.ref.rep === 'E' || row.ref.rep === 'I'; });
      if (flagged && rules.useRepeatFlags !== false) {
        // El transcript indica qué intento cuenta (columna R: I = incluido, E = excluido)
        chosen = gpaAttempts.filter(function (row) { return row.ref.rep !== 'E'; });
        gpaAttempts.forEach(function (row) {
          if (chosen.indexOf(row) >= 0) { row.counts = true; row.points = row.info.pts * row.credits; row.reason = 'Cuenta (indicado en el transcript)'; }
          else row.reason = 'Repetido: excluido según el transcript (E)';
        });
        return;
      }
      if (rules.repeatPolicy === 'all') chosen = gpaAttempts;
      else if (rules.repeatPolicy === 'latest') {
        chosen = [gpaAttempts.slice().sort(function (a, b) { return b.order - a.order; })[0]];
      } else {
        chosen = [gpaAttempts.slice().sort(function (a, b) {
          return (b.info.pts - a.info.pts) || (b.order - a.order);
        })[0]];
      }
      gpaAttempts.forEach(function (row) {
        if (chosen.indexOf(row) >= 0) {
          row.counts = true;
          row.points = row.info.pts * row.credits;
          row.reason = (gpaAttempts.length > 1 && rules.repeatPolicy !== 'all')
            ? 'Cuenta (intento usado entre repeticiones)' : 'Cuenta para GPA';
        } else {
          row.reason = rules.repeatPolicy === 'latest'
            ? 'Repetido: se usa el intento más reciente' : 'Repetido: se usa la nota más alta';
        }
      });
    });

    var gpaCredits = sum(rows.filter(function (r) { return r.counts; }), function (r) { return r.credits; });
    var qp = sum(rows.filter(function (r) { return r.counts; }), function (r) { return r.points; });

    // Créditos aprobados: una sola vez por código (mejor intento aprobado).
    var earned = 0, earnedPrep = 0;
    Object.keys(groups).forEach(function (code) {
      var best = null;
      groups[code].forEach(function (row) {
        var info = gradeInfo(row.grade, rules);
        if (info.approved && (!best || row.credits > best.credits)) best = row;
      });
      if (best) {
        if (isPrepCode(code, rules, prepTypeOf(code))) earnedPrep += best.credits;
        else earned += best.credits;
      }
    });

    return {
      gpa: gpaCredits > 0 ? qp / gpaCredits : null,
      qualityPoints: qp, gpaCredits: gpaCredits,
      earnedCredits: earned, earnedPrepCredits: earnedPrep,
      rows: rows
    };
  }


  /** Créditos aprobados vs. intentados (todas las veces que se tomó cada curso; IP no cuenta). */
  function completionRate(records) {
    var att = 0, pass = 0;
    records.forEach(function (r) {
      var g = String(r.grade || '').toUpperCase(), cr = num(r.credits);
      if (g === 'IP' || !g) return;
      if (['A', 'B', 'C', 'D', 'F', 'W', 'WF', 'NP', 'P', 'IF', 'ID', 'IC', 'T', 'CE'].indexOf(g) < 0) return;
      att += cr;
      if (['A', 'B', 'C', 'D', 'P', 'T', 'CE'].indexOf(g) >= 0) pass += cr;
    });
    return { attempted: att, passed: pass, rate: att > 0 ? pass / att : null };
  }

  /** Prueba combinaciones de reglas para localizar cuál reproduce el GPA oficial. */
  function gpaScenarios(records, baseRules, prepTypeOf, official) {
    var out = [];
    ['highest', 'latest', 'all'].forEach(function (rp) {
      [true, false].forEach(function (ip) {
        ['exclude', 'asF'].forEach(function (wf) {
          var rules = Object.assign({}, baseRules, { repeatPolicy: rp, includePrep: ip, wfPolicy: wf });
          var r = computeGPA(records, rules, prepTypeOf);
          var match = false;
          if (official != null && r.gpa != null) {
            match = Math.abs(round2(r.gpa) - official) < 0.001 || Math.abs(trunc2(r.gpa) - official) < 0.001;
          }
          out.push({ repeatPolicy: rp, includePrep: ip, wfPolicy: wf, gpa: r.gpa, credits: r.gpaCredits, match: match });
        });
      });
    });
    return out;
  }
  function round2(x) { return Math.round(x * 100 + 1e-9) / 100; }
  function trunc2(x) { return Math.floor(x * 100 + 1e-9) / 100; }

  /* ============================================================
     TRANSCRIPT PARSER (datos del estudiante)
     ============================================================ */
  var GRADE_TOKENS = ['IP', 'IF', 'ID', 'IC', 'WF', 'NP', 'CE', 'W', 'T', 'P', 'A', 'B', 'C', 'D', 'F'];
  var TERM_RE = /\b(FALL|FA|OTO[ÑN]O|WINTER|WI|INVIERNO|SPRING|SP|PRIMAVERA|SUMMER|SU|VERANO)[\s\-\/]*((?:19|20)?\d{2})(?:\s*-\s*(?:19|20)?\d{2})?\b/i;
  var SEASON_MAP = { FALL: 'Fall', FA: 'Fall', 'OTOÑO': 'Fall', OTONO: 'Fall', WINTER: 'Winter', WI: 'Winter', INVIERNO: 'Winter',
    SPRING: 'Spring', SP: 'Spring', PRIMAVERA: 'Spring', SUMMER: 'Summer', SU: 'Summer', VERANO: 'Summer' };

  function parseTranscriptText(text) {
    var lines = String(text || '').split(/\r?\n/).map(function (l) { return l.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    var student = { name: '', program: '', id: '' };
    var records = [], currentTerm = '', gpaCandidates = [], inProgress = false, totals = null;
    lines.forEach(function (line) {
      var m;
      if (!student.name && (m = line.match(/^(?:Nombre|Name|Estudiante|Student(?: Name)?)\s*[:\-]\s*(.+)$/i))) student.name = m[1].trim();
      if (!student.program && (m = line.match(/(?:Programa|Program|Major|Degree|Grado)\s*[:\-]\s*(.+)$/i))) student.program = m[1].trim();
      if (!student.id && (m = line.match(/(?:Student\s*(?:#|No\.?|Number|ID)|N[úu]m(?:ero)?\.?\s*(?:de\s*)?estudiante|ID)\s*[:#\-]?\s*([A-Z]?\d[\d\-]{3,})/i))) student.id = m[1].trim();
      var gRe = /(GPA|Promedio|Índice|Indice)[^0-9]{0,40}([0-4][.,]\d{2,3})/gi, gm;
      while ((gm = gRe.exec(line))) {
        gpaCandidates.push({ value: num(gm[2]), cumulative: /acum|cumul|general|overall|total/i.test(line) });
      }
      var tot = line.match(/^(Overall|Total Institution|Cumulative)\s+((?:\d+(?:\.\d+)?\s+){5})(\d\.\d{2,3})\s*$/i);
      if (tot) {
        gpaCandidates.push({ value: num(tot[3]), cumulative: true, rank: /overall/i.test(tot[1]) ? 3 : /total/i.test(tot[1]) ? 2 : 1 });
        var nn = tot[2].trim().split(/\s+/).map(num);
        var rk = /overall/i.test(tot[1]) ? 3 : /total/i.test(tot[1]) ? 2 : 1;
        if (!totals || rk >= totals.rank) totals = { rank: rk, attempted: nn[0], passed: nn[1], earned: nn[2], gpaHours: nn[3], qualityPoints: nn[4], gpa: num(tot[3]) };
        return;
      }
      // Sección de cursos en progreso (Banner: "Courses in Progress")
      if (/course(?:s|\(s\))?\s+in\s+progress|cursos?\s+en\s+progreso/i.test(line)) { inProgress = true; return; }
      if (/transcript\s+totals|institution\s+credit|transfer\s+credit/i.test(line)) inProgress = false;
      var codeMatch = line.toUpperCase().match(CODE_RE);
      var tm = line.match(TERM_RE);
      if (tm) {
        var season = SEASON_MAP[tm[1].toUpperCase()] || tm[1];
        var yr = tm[2].length === 2 ? '20' + tm[2] : tm[2];
        currentTerm = Terms.label({ season: season, year: yr });
        if (!codeMatch) return;
      }
      if (!codeMatch) return;
      // "Fall 2026", "Spring 2027"… no son códigos de curso
      if (/^(FALL|SPRING|SUMMER|WINTER|TERM|YEAR|ROOM)$/.test(codeMatch[1])) return;
      var up = line.toUpperCase();
      var rest = up.slice(up.indexOf(codeMatch[0]) + codeMatch[0].length).trim();
      var tokens = rest ? rest.split(' ') : [];
      var gradeIdx = -1;
      for (var i = tokens.length - 1; i >= 0; i--) {
        if (inProgress ? tokens[i] === 'IP' : GRADE_TOKENS.indexOf(tokens[i]) >= 0) { gradeIdx = i; break; }
      }
      var nums = tokens.filter(function (x) { return /^\d{1,3}([.,]\d{1,3})?$/.test(x); });
      var implicitIP = false;
      if (gradeIdx < 0) {
        // Sin nota: curso en progreso si está en esa sección, o si la línea trae solo los créditos (sin puntos de calidad).
        if (inProgress || (nums.length === 1 && /\d[.,]\d{3}$/.test(nums[0]))) { implicitIP = true; gradeIdx = tokens.length; }
        else return;
      }
      var firstNum = -1;
      for (var j = 0; j < tokens.length; j++) {
        if (/^\d{1,2}([.,]\d{1,3})?$/.test(tokens[j]) && num(tokens[j]) <= 15) { firstNum = j; break; }
      }
      var titleEnd = firstNum >= 0 && firstNum < gradeIdx ? firstNum : gradeIdx;
      var title = line.split(' ').slice(line.split(' ').length - tokens.length, line.split(' ').length - tokens.length + titleEnd).join(' ');
      var credits = firstNum >= 0 ? num(tokens[firstNum]) : 0;
      title = title.replace(/^(UG|GR)\b\s*/i, '').replace(/\b(UG|GR)\b\s*/i, '').replace(/PUPR Main Campus\s*(\(San\s*(Juan\))?)?/i, '').trim();
      var rep = '';
      var lastTok = tokens[tokens.length - 1];
      if ((lastTok === 'E' || lastTok === 'I') && tokens.length >= 3 && /^\d/.test(tokens[tokens.length - 2])) rep = lastTok;
      records.push({ id: uid(), code: normCode(codeMatch[0]), title: title.trim(), credits: credits,
        grade: implicitIP ? 'IP' : tokens[gradeIdx], term: currentTerm, order: records.length, rep: rep });
    });
    var official = null;
    if (gpaCandidates.length) {
      var ranked = gpaCandidates.filter(function (c) { return c.rank; });
      if (ranked.length) {
        var best = Math.max.apply(null, ranked.map(function (c) { return c.rank; }));
        var top = ranked.filter(function (c) { return c.rank === best; });
        official = top[top.length - 1].value;
      } else {
        var cum = gpaCandidates.filter(function (c) { return c.cumulative; });
        official = (cum.length ? cum[cum.length - 1] : gpaCandidates[gpaCandidates.length - 1]).value;
      }
    }
    return { student: student, records: records, officialGPA: official, officialTotals: totals };
  }

  /* ============================================================
     CURRÍCULO (reglas del programa)
     Formato: Código | Nombre | Créditos | Prerrequisitos | Correquisitos | Tipo | Grupo | Término mínimo
     Tipo: REQ, PREP, CAP, ELEC (espacio de electiva), OPC (opción de un grupo)
     ============================================================ */
  var TYPES = ['REQ', 'PREP', 'CAP', 'ELEC', 'OPC'];
  var OFFER_MAP = { FA: 'Fall', WI: 'Winter', SP: 'Spring', SU: 'Summer', FALL: 'Fall', WINTER: 'Winter', SPRING: 'Spring', SUMMER: 'Summer' };
  /** Oferta por término: "FA/SP" -> ['Fall','Spring']. Vacío o "+++" = sin restricción. */
  function parseOffer(v) {
    var t = String(v || '').toUpperCase().trim();
    if (!t || t === '+++') return null;
    var out = [];
    t.split(/[\/,\s]+/).forEach(function (x) { if (OFFER_MAP[x] && out.indexOf(OFFER_MAP[x]) < 0) out.push(OFFER_MAP[x]); });
    return out.length ? out : null;
  }
  function offeredIn(u, season) { return !u || !u.offer || !u.offer.length || u.offer.indexOf(season) >= 0; }
  function parseReqs(s) {
    if (!s) return [];
    return String(s).split(/,|;|\s+y\s+|\s+and\s+/i).map(function (item) {
      return item.split(/\/|\s+o\s+|\s+or\s+/i).filter(isCourseCode).map(normCode);
    }).filter(function (ors) { return ors.length; });
  }
  function parseCurriculum(text) {
    var program = '', reqCredits = null, courses = [], errors = [], warnings = [], section = '';
    String(text || '').split(/\r?\n/).forEach(function (raw, i) {
      var line = raw.trim(), m;
      if (!line) return;
      if ((m = line.match(/^#?\s*Programa\s*:\s*(.+)$/i))) { program = m[1].trim(); return; }
      if ((m = line.match(/^#?\s*Cr[ée]ditos\s+requeridos\s*:\s*(\d+)/i))) { reqCredits = +m[1]; return; }
      if ((m = line.match(/^##\s*(.+)$/))) { section = m[1].trim(); return; }
      if (line.charAt(0) === '#') return;
      if (line.indexOf('|') < 0) { errors.push('Línea ' + (i + 1) + ': falta el separador "|".'); return; }
      var c = line.split('|').map(function (s) { return s.trim(); });
      if (/^c[óo]digo$/i.test(c[0])) return;
      var credits = parseFloat(String(c[2] || '').replace(',', '.'));
      if (!c[0]) { errors.push('Línea ' + (i + 1) + ': falta el código.'); return; }
      if (isNaN(credits)) { errors.push('Línea ' + (i + 1) + ': créditos no válidos en ' + c[0] + '.'); return; }
      var type = (c[5] || 'REQ').toUpperCase();
      if (TYPES.indexOf(type) < 0) { errors.push('Línea ' + (i + 1) + ': tipo "' + type + '" no reconocido.'); return; }
      courses.push({
        code: isCourseCode(c[0]) ? normCode(c[0]) : c[0].toUpperCase(),
        name: c[1] || '', credits: credits,
        prereqs: parseReqs(c[3]), prereqText: c[3] || '',
        coreqs: parseReqs(c[4]), coreqText: c[4] || '',
        type: type, group: (c[6] || '').toUpperCase(), minTerm: parseInt(c[7], 10) || 0,
        seq: parseInt(c[8], 10) || 0,
        offer: parseOffer(c[9]),
        section: section || ({ PREP: 'Cursos preparatorios', REQ: 'Cursos requeridos', CAP: 'Proyecto / Capstone', ELEC: 'Electivas', OPC: 'Electivas' }[type]),
        order: courses.length
      });
    });
    var seen = {};
    courses.forEach(function (c) {
      if (seen[c.code]) errors.push('Código duplicado: ' + c.code + '.');
      seen[c.code] = true;
    });
    courses.forEach(function (c) {
      c.prereqs.concat(c.coreqs).forEach(function (ors) {
        ors.forEach(function (code) {
          if (!seen[code]) warnings.push(c.code + ' menciona ' + code + ', que no está en el currículo.');
        });
      });
      if (c.type === 'ELEC' && c.group && !courses.some(function (o) { return o.type === 'OPC' && o.group === c.group; }))
        warnings.push('La electiva ' + c.code + ' (grupo ' + c.group + ') no tiene opciones OPC definidas.');
    });
    var required = reqCredits != null ? reqCredits : sum(courses.filter(function (c) {
      return c.type === 'REQ' || c.type === 'CAP' || c.type === 'ELEC';
    }), function (c) { return c.credits; });
    return { program: program, requiredCredits: required, courses: courses, errors: errors, warnings: warnings };
  }

  /** Borrador desde texto de PDF: siempre requiere revisión humana. */
  function draftCurriculumFromText(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var line = raw.replace(/\s+/g, ' ').trim();
      var up = line.toUpperCase();
      var m = up.match(/^([A-Z]{2,5})\s*-?\s*(\d{4}[A-Z]?)\b/);
      if (!m) return;
      var code = m[1] + ' ' + m[2];
      var rest = line.slice(m[0].length).trim();
      var tokens = rest.split(' ');
      var ci = -1;
      for (var i = 0; i < tokens.length; i++) { if (/^\d{1,2}$/.test(tokens[i]) && +tokens[i] <= 12) { ci = i; break; } }
      var name = (ci >= 0 ? tokens.slice(0, ci) : tokens).join(' ');
      var credits = ci >= 0 ? tokens[ci] : '';

function defaultState(){
  return {
    program:'', student:{name:''}, records:[], officialGPA:null,
    curricula:{}, gpaRules:JSON.parse(JSON.stringify(Core.DEFAULT_GPA_RULES)),
    plannerRules:Object.assign({}, Core.DEFAULT_PLANNER_RULES),
    electiveSel:{}, planOriginal:null, plan:null, planEdited:false, historyChanged:false,
    transcriptText:'', transcriptName:'', prepExempt:{}, customOptions:{}, programBase:'', roster:{}, currentId:Core.uid(), offerOverrides:{}, useOfficialGPA:false, gpaOverride:null, summerOffMigrated:true, prevLoad:null
  };

function load(){
  try{ var raw = localStorage.getItem(STORE); if(!raw) return null;
    var s = JSON.parse(raw); var needSummerOff = !s.summerOffMigrated; var d = defaultState();
    Object.keys(d).forEach(function(k){ if(!(k in s)) s[k]=d[k]; });
    s.plannerRules = Object.assign({}, Core.DEFAULT_PLANNER_RULES, s.plannerRules||{});
    // Summer pasa a estar desactivado por defecto (una sola vez para datos guardados antes)
    if(needSummerOff){
      s.plannerRules.includeSummer=false; s.summerOffMigrated=true; s._summerRegen=true;
      Object.keys(s.roster||{}).forEach(function(k){ var r=s.roster[k]; if(r && r.plan && r.plan.terms && r.plan.terms.some(function(t){return t.season==='Summer';})){ if(r.planEdited) r.historyChanged=true; else { r.plan=null; r.planOriginal=null; } } });
    }
    // Nombres de programa que cambiaron: se migran para que el plan guardado siga apareciendo
    var REN={'Electrical Engineering - Power':'Electrical Engineering - Smart Grid Power Systems','Electrical Engineering - Systems':'Electrical Engineering - Communications, Signals & Control Systems'};
    var fix=function(o){ if(o && REN[o.program]){ o.program=REN[o.program]; o.programBase='Electrical Engineering'; } };
    fix(s); Object.keys(s.roster||{}).forEach(function(k){ fix(s.roster[k]); });
    var mig=function(o){ if(o && o.useOfficialGPA && o.officialGPA!=null && o.gpaOverride==null){ o.gpaOverride=o.officialGPA; o.useOfficialGPA=false; } };
    mig(s); Object.keys(s.roster||{}).forEach(function(k){ mig(s.roster[k]); });
    ['customOptions','prepExempt','offerOverrides','curricula'].forEach(function(key){ var m=s[key]; if(!m) return; Object.keys(REN).forEach(function(o){ if(m[o] && !m[REN[o]]){ m[REN[o]]=m[o]; } delete m[o]; }); });
    s.gpaRules = Object.assign({}, Core.DEFAULT_GPA_RULES, s.gpaRules||{});
    return s;
  }catch(e){ return null; }
}

function save(){
  if(!S.roster) S.roster={}; if(!S.currentId) S.currentId=Core.uid();
  if(hasStudentData()) S.roster[S.currentId]=snapshotStudent();
  try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){ toast('No se pudo guardar: el almacenamiento del navegador está lleno.'); }

function clone(x){ return JSON.parse(JSON.stringify(x)); }

function curr(){
  var c = S.curricula[S.program];
  var text = (c && c.text) || PRESETS[S.program];
  if(!text) return null;
  var p = Core.parseCurriculum(text);
  if(!p.courses.length) return null;
  var ov=(S.offerOverrides||{})[S.program]||{};
  p.courses.forEach(function(x){ if(Object.prototype.hasOwnProperty.call(ov,x.code)) x.offer=ov[x.code]&&ov[x.code].length?ov[x.code]:null; });
  var have={}; p.courses.forEach(function(x){ have[x.code]=true; });
  ((S.customOptions||{})[S.program]||[]).forEach(function(o){
    if(have[o.code]) return;
    var slot=p.courses.filter(function(x){return x.type==='ELEC' && x.group===o.group;})[0];
    p.courses.push({code:o.code,name:o.name,credits:o.credits,prereqs:[],coreqs:[],prereqText:'',coreqText:'',type:'OPC',group:o.group,minTerm:0,order:p.courses.length,custom:true,section:slot?slot.section:'Electivas'});
  });
  return p;
}
function prepTypeOf(cur){
  var map = {}; if(cur) cur.courses.forEach(function(c){ map[c.code]=c.type; });
  return function(code){ return map[code] || null; };

function exportBackup(){
  save();
  var d=new Date(), ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  var data=JSON.stringify({app:'planificador-pupr', version:1, exported:d.toISOString(), state:S});
  saveFile('Respaldo Planificador PUPR '+ds+'.json', new Blob([data],{type:'application/json'}));
}
function importBackup(){
  var input=document.createElement('input'); input.type='file'; input.accept='.json,application/json';
  input.onchange=function(){
    var f=input.files[0]; if(!f) return;
    readFileAsText(f).then(function(txt){
      var obj; try{ obj=JSON.parse(txt); }catch(e){ throw new Error('El archivo no es un respaldo válido.'); }
      var st=obj && obj.app==='planificador-pupr' ? obj.state : null;
      if(!st || typeof st!=='object') throw new Error('El archivo no es un respaldo del Planificador PUPR.');
      var n=Object.keys(st.roster||{}).length;
      modal({title:'Importar respaldo', narrow:true, body:'<p style="margin-top:0">El respaldo tiene <strong>'+n+' estudiante'+(n===1?'':'s')+'</strong>. Reemplazará los estudiantes, currículos agregados y ajustes de este navegador.</p>',
        buttons:[{label:'Cancelar'},{label:'Importar',primary:true,onClick:function(){
          try{ localStorage.setItem(STORE, JSON.stringify(st)); }catch(e){ toast('No se pudo guardar el respaldo en este navegador.'); return; }
          location.reload();
        }}]});
    }).catch(function(err){ showError('No se pudo importar', err); });
  };
  input.click();
}
function openStudents(){
  save();

    var s=S.roster[id], nm=(s.student&&s.student.name)||'Estudiante sin nombre';

      '<br><span class="small muted">'+(s.student&&s.student.id?'Núm. '+esc(s.student.id)+' · ':'')+esc(prog)+' · '+(s.records?s.records.length:0)+' cursos · '+ds+'</span></div>'+

  }
  var body='<p class="small muted" style="margin-top:0">Los estudiantes se guardan solos en este navegador. Usa <strong>Exportar respaldo</strong> para guardarlos en un archivo y <strong>Importar respaldo</strong> para pasarlos a otra computadora o a otra versión de la app.</p>'+
    '<div class="row" style="margin-bottom:10px"><button class="btn sm" data-bk="export">Exportar respaldo</button><button class="btn sm" data-bk="import">Importar respaldo</button></div>'+
    (ids.length>5?'<input data-q placeholder="Buscar por nombre, número o programa" style="width:100%;margin-bottom:10px">':'')+
    '<div class="stlist">'+(ids.length?ids.map(row).join(''):'<p class="muted">Aún no hay estudiantes guardados. Escribe el nombre del estudiante y quedará en esta lista.</p>')+'</div>';
  var m=modal({title:'Estudiantes', body:body, buttons:[{label:'Nuevo estudiante', left:true, onClick:function(){ setTimeout(startNewStudent,0); }},{label:'Cerrar',primary:true}]});
  var q=m.body.querySelector('[data-q]');
  if(q) q.addEventListener('input',function(){ var v=q.value.toLowerCase(); m.body.querySelectorAll('.strow').forEach(function(r){ r.classList.toggle('hidden', r.getAttribute('data-q').indexOf(v)<0); }); });
  m.body.addEventListener('click',function(e){
    var bk=e.target.closest('[data-bk]');
    if(bk){
      if(bk.getAttribute('data-bk')==='export') exportBackup(); else { m.close(); importBackup(); }
      return;
    }

    var id=b.closest('.strow').getAttribute('data-id');
    if(b.getAttribute('data-st')==='open'){ m.close(); loadStudent(id); return; }

    modal({title:'Eliminar estudiante', narrow:true, body:'<p style="margin-top:0">Se eliminará a '+esc(nm)+' de la lista, con su historial y su plan. No se puede deshacer.</p>',
      buttons:[{label:'Cancelar'},{label:'Eliminar',primary:true,danger:true,onClick:function(){

        else save();
        m.close(); openStudents(); toast('Estudiante eliminado.');
      }}]});
  });
}

function modal(opts){
  var ov=document.createElement('div'); ov.className='overlay';
  if(opts.sheet) ov.classList.add('sheeto');

  var body=ov.querySelector('.mbody'), foot=ov.querySelector('footer');
  if(typeof opts.body==='string') body.innerHTML=opts.body; else if(opts.body) body.appendChild(opts.body);
  function close(){ ov.remove(); document.removeEventListener('keydown',onKey); if(opts.onClose) opts.onClose(); }
  function onKey(e){ if(e.key==='Escape') close(); }
  (opts.buttons||[]).forEach(function(b){
    var el=document.createElement('button'); el.className='btn'+(b.primary?' primary':'')+(b.danger?' danger':'')+(b.left?' left':'');
    el.textContent=b.label; el.addEventListener('click',function(){ var r=b.onClick? b.onClick(body):undefined; if(r!==false) close(); });
    foot.appendChild(el);
  });

  ov.querySelector('[data-x]').addEventListener('click',close);
  ov.addEventListener('mousedown',function(e){ if(e.target===ov) close(); });
  document.addEventListener('keydown',onKey);
  document.body.appendChild(ov);

  return { body:body, close:close, el:ov };

function academicSummary(){
  var cur=curr(), g=gpaResult();
  var ov=gpaOverride();
  var out={ gpa:ov!=null?ov:g.gpa, gpaCalc:g.gpa, gpaEdited:ov!=null, earned:g.earnedCredits, earnedPrep:g.earnedPrepCredits, pending:null, grad:'—',
    prog:{done:0,ip:0,pend:0,prepDone:0,prepTotal:0} };
  if(!cur) return out;
  var st=Core.buildStatus(cur, S.records, S.plannerRules);
  var satisfied=0, ex=exemptList(); out.prog.prepExempt=0;
  cur.courses.forEach(function(c){
    if(c.type==='OPC') return;
    if(c.type==='PREP' && ex.indexOf(c.code)>=0 && !st.approved[c.code]){ out.prog.prepExempt++; if(c.group==='CUENTA') satisfied+=c.credits; return; }
    var s = c.type==='ELEC' ? st.slots[c.code] : st.byCode[c.code];
    var status = s ? s.status : 'pending';
    // Preparatorios que el currículo cuenta dentro del total (Arquitectura, Diseño): grupo CUENTA.
    if(status==='done' && (c.type!=='PREP' || c.group==='CUENTA')) satisfied+=c.credits;
    if(status==='done') out.prog.done+=c.credits; else if(status==='ip') out.prog.ip+=c.credits; else out.prog.pend+=c.credits;
    if(c.type==='PREP'){ out.prog.prepTotal++; if(status==='done') out.prog.prepDone++; }
  });
  out.pending=Math.max(0, cur.requiredCredits - satisfied);
  if(S.plan){
    var nonEmpty=S.plan.terms.filter(function(t){return t.courses.length;});
    if(nonEmpty.length) out.grad = tS(nonEmpty[nonEmpty.length-1].label) + (S.plan.unscheduled.length?' *':'');
  }
  return out;
}

/* ---------------- Probatoria académica ---------------- */
function probationStatus(){
  var pr=S.plannerRules, items=[], level='ok';
  if(!S.records.length) return {level:level, items:items};
  var g=gpaResult();
  var src='calculado', gpa=g.gpa;
  if(gpaOverride()!=null){ gpa=gpaOverride(); src='editado'; }
  else if(S.officialGPA!=null){ gpa=S.officialGPA; src='oficial del transcript'; }
  var minG=Core.num(pr.minGPA!=null?pr.minGPA:2), warnG=Core.num(pr.gpaWarn!=null?pr.gpaWarn:2.1);
  if(gpa!=null){
    var gr=Math.round(gpa*1000)/1000;
    if(gr<minG){ level='bad'; items.push({lvl:'bad',t:'Probatoria académica: GPA '+fmt(gpa,gpa*100%1?3:2)+' ('+src+'), por debajo de '+fmt(minG)+'.'}); }
    else if(gr<=warnG){ if(level!=='bad') level='warn'; items.push({lvl:'warn',t:'Atención: GPA '+fmt(gpa,3)+' ('+src+'), a punto de caer por debajo de '+fmt(minG)+' (aviso hasta '+fmt(warnG)+').'}); }
  }
  var cr, src2;
  if(S.officialTotals && S.officialTotals.attempted>0){ cr={attempted:S.officialTotals.attempted, passed:S.officialTotals.passed}; src2='según el transcript'; }
  else { cr=Core.completionRate(S.records); src2='calculado'; }
  if(cr.attempted>0){
    var rate=cr.passed/cr.attempted*100, minR=Core.num(pr.minRate!=null?pr.minRate:66), warnR=Core.num(pr.rateWarn!=null?pr.rateWarn:70);
    var txt=fmtCr(cr.passed)+' aprobados de '+fmtCr(cr.attempted)+' intentados = '+rate.toFixed(1)+'% ('+src2+')';
    if(rate<minR){ level='bad'; items.push({lvl:'bad',t:'Probatoria académica: '+txt+', por debajo de '+minR+'%.'}); }
    else if(rate<warnR){ if(level!=='bad') level='warn'; items.push({lvl:'warn',t:'Atención: '+txt+', cerca del mínimo de '+minR+'% (aviso por debajo de '+warnR+'%).'}); }
  }
  return {level:level, items:items};
}

/* ---------------- Alertas académicas ---------------- */
function academicAlerts(){
  var cur=curr(), out=[]; if(!cur) return out;
  var pr=prEff(), g=gpaResult(), st=Core.buildStatus(cur,S.records,pr);
  var minG=Core.num(pr.minGPA!=null?pr.minGPA:2);
  var ps=probationStatus();
  ps.items.forEach(function(x){ out.push(x); });
  // Cursos fracasados o incompletos que bloquean otros
  var deps={}; cur.courses.forEach(function(c){ (c.prereqs||[]).forEach(function(o){ o.forEach(function(p){ (deps[p]=deps[p]||[]).push(c.code); }); }); });
  function chain(code,seen){ (deps[code]||[]).forEach(function(d){ if(!seen[d]){ seen[d]=true; chain(d,seen); } }); return seen; }
  Object.keys(st.lastGrade).forEach(function(code){
    if(st.approved[code] || st.ip[code]) return;
    var gr=st.lastGrade[code];
    if(['F','WF','W','IF','ID','IC'].indexOf(gr)<0) return;
    var blocked=Object.keys(chain(code,{})).filter(function(c){ return !st.approved[c]; });
    var inc=['IF','ID','IC'].indexOf(gr)>=0;
    out.push({lvl:blocked.length?'bad':'warn', t:code+' ('+gr+')'+(inc?' está incompleto':' no está aprobado')+
      (blocked.length?' y bloquea '+blocked.length+' curso'+(blocked.length>1?'s':'')+': '+blocked.slice(0,6).join(', ')+(blocked.length>6?'…':'')+'.':'.')});
  });
  if(S.plan){
    var base=baseDone(), last=-1;
    S.plan.terms.forEach(function(t,i){ if(t.courses.length) last=i; });
    var low=[], over=[], bad=[];
    S.plan.terms.forEach(function(t,i){
      if(!t.courses.length) return;
      var cr=Core.termCredits(t);
      if(cr<pr.minCredits && i<last) low.push(tS(t.label)+' ('+fmtCr(cr)+')');
      if(cr>Core.termCap(t,pr)) over.push(tS(t.label)+' ('+fmtCr(cr)+' cr)');
      var ccap=Core.termCourseCap(t,pr); if(ccap && Core.classCount(t.courses)>ccap && !t.courses.some(function(c){return c.grade==='IP';})) over.push(tS(t.label)+' ('+Core.classCount(t.courses)+' clases, máx. '+ccap+')');
      t.courses.forEach(function(c){
        var w=Core.validatePlacement(S.plan,c,i,base,pr).filter(function(x){ return !/quedaría con/.test(x); });
        if(w.length) bad.push(c.code+' en '+tS(t.label)+': '+w[0]);
      });
    });
    if(low.length) out.push({lvl:'warn',t:'Términos por debajo de la carga mínima de '+pr.minCredits+' créditos (beca): '+low.join(', ')+'.'});
    if(over.length) out.push({lvl:'bad',t:'Términos sobre el máximo de créditos: '+over.join(', ')+'.'});
    bad.slice(0,8).forEach(function(x){ out.push({lvl:'bad',t:x}); });
    if(bad.length>8) out.push({lvl:'bad',t:'Y '+(bad.length-8)+' conflicto(s) más en el plan editado.'});
  }
  return out;
}
function alertsHTML(){
  var al=academicAlerts(); if(!al.length) return '';
  var nb=al.filter(function(a){return a.lvl==='bad';}).length;
  return '<details class="alerts"'+(session.alertsOpen===false?'':' open')+' id="alertsBox"><summary><strong>Alertas académicas</strong> <span class="tag">'+al.length+'</span>'+(nb?' <span class="small" style="color:var(--danger)">'+nb+' importante'+(nb>1?'s':'')+'</span>':'')+'</summary><ul>'+

    {k:'actual', t:'Plan actual', ch:{}},

    {k:'c15', t:'Hasta 15 créditos', ch:{maxCredits:Math.max(15,base.maxCredits)}},
    {k:'su13', t:'Summer + 13 créditos', ch:{includeSummer:true, maxCredits:Math.max(13,base.maxCredits)}},
    {k:'su15', t:'Summer + 15 créditos', ch:{includeSummer:true, maxCredits:Math.max(15,base.maxCredits)}},
    {k:'su18', t:'Summer + 18 créditos', ch:{includeSummer:true, maxCredits:18, summerMax:Math.max(base.summerMax||12,12)}}
  ];
  if(base.maxCourses) opts.splice(1,0,{k:'nolim', t:'Sin límite de clases', ch:{maxCourses:0}});
  var rows=opts.map(function(o){

    return {o:o, terms:ne.length, grad:ne.length?ne[ne.length-1].label:'—', uns:p.unscheduled.length, maxT:Math.max.apply(null,ne.map(function(t){return Core.termCredits(t);}).concat([0]))};
  }).filter(Boolean);
  // Fecha real de graduación (FA Y → WI Y → SP Y+1 → SU Y+1)
  function gradIdx(lbl){ var p=Core.Terms.parse(lbl); if(!p) return 1e9; var o={Fall:0,Winter:1,Spring:2,Summer:3}[p.season]; return (p.season==='Fall'||p.season==='Winter'?p.year:p.year-1)*4+o; }
  rows.forEach(function(r){ r.idx=gradIdx(r.grad); });
  var cur0=rows[0], best=rows.filter(function(r){return !r.uns;}).reduce(function(b,r){ return (!b||r.idx<b.idx||(r.idx===b.idx&&r.terms<b.terms))?r:b; },null);
  var html='<p style="margin-top:0" class="small muted">Compara cuánto se acorta el plan con cada cambio. Siempre respeta prerrequisitos, correquisitos y las demás reglas.</p>'+
    '<table class="plain"><thead><tr><th>Opción</th><th class="num">Términos</th><th>Graduación</th><th></th></tr></thead><tbody>'+
    rows.map(function(r,i){
      var gain=cur0.idx-r.idx;
      return '<tr'+(best&&r===best&&gain>0?' class="match"':'')+'><td>'+esc(r.o.t)+(i===0?' <span class="tag">actual</span>':'')+'</td><td class="num">'+r.terms+'</td><td>'+esc(r.grad)+(gain>0?' <span class="small" style="color:var(--ok)">'+gain+' trimestre'+(gain>1?'s':'')+' antes</span>':'')+'</td>'+
        '<td>'+(i===0?'':'<button class="btn sm'+(best&&r===best&&gain>0?' primary':'')+'" data-fast="'+i+'">Aplicar</button>')+'</td></tr>';
    }).join('')+'</tbody></table>'+
    (best&&best.idx<cur0.idx?'<p class="small" style="margin-bottom:0">La opción más rápida es <strong>'+esc(best.o.t)+'</strong>: termina en <strong>'+esc(best.grad)+'</strong>.</p>':'<p class="small" style="margin-bottom:0">Con las reglas actuales, el plan ya está en su menor duración posible.</p>');
  var m=modal({title:'Terminar antes', body:html, buttons:[{label:'Cerrar',primary:true}]});
  m.body.addEventListener('click',function(e){
    var b=e.target.closest('[data-fast]'); if(!b) return;
    var r=rows[+b.getAttribute('data-fast')];
    rememberLoad(); Object.assign(S.plannerRules, r.o.ch); save(); m.close();
    if(S.planEdited){ modal({title:'Aplicar', narrow:true, body:'<p style="margin-top:0">El plan tiene cambios manuales. Para aplicar esta opción se regenera el plan.</p>', buttons:[{label:'Cancelar'},{label:'Regenerar',primary:true,onClick:function(){ regenerate(true); toast('Plan actualizado: '+r.o.t+'.'); }}]}); }
    else { regenerate(true); toast('Plan actualizado: '+r.o.t+'. Graduación estimada '+r.grad+'.'); }
  });
}

/* ---------------- Comparar programas ---------------- */
function curriculumFor(key){
  if(key===S.program) return curr();
  var c=S.curricula[key]; var text=(c&&c.text)||PRESETS[key]; if(!text) return null;
  var p=Core.parseCurriculum(text); if(!p.courses.length) return null;
  var ov=(S.offerOverrides||{})[key]||{};
  p.courses.forEach(function(x){ if(Object.prototype.hasOwnProperty.call(ov,x.code)) x.offer=ov[x.code]&&ov[x.code].length?ov[x.code]:null; });
  return p;
}
function allProgramKeys(){ return PROGRAMS.concat(Object.keys(S.curricula).filter(function(p){ return PROGRAMS.indexOf(p)<0; })); }
function programName(key){ var g=groupOfKey(key), sp=specLabel(key); return g ? g.name+(sp?' - '+sp:'') : key; }
// Materias que pueden contar como electiva sociohumanística (SOHU) o de ciencias sociales (SOC).
var SOC_SUBJ=['PSYC','ECON','ANTH','SOCI','SOSC','POSC'];
var SOHU_SUBJ=SOC_SUBJ.concat(['HUMA','HIST','PHIL','ARTS','ART','MUSI','LITE','FREN','ITAL','GERM','PORT','JAPA','CHIN','GEOG','COMM','SPAN','ENGL','THEA','RELI','ETHI']);
/** Acomoda en espacios de electiva libre/SOHU los cursos aprobados que no están en el currículo. */
function fillWithLeftovers(cur){
  var st=Core.buildStatus(cur,S.records,S.plannerRules), inCur={}, used={};
  cur.courses.forEach(function(c){ inCur[c.code]=true; });
  Object.keys(st.slots).forEach(function(k){ if(st.slots[k].filledBy) used[st.slots[k].filledBy]=true; });
  var left=st.approvedCodes.filter(function(code){ return !inCur[code] && !used[code] && !/^\S+\s+0/.test(code); })
    .map(function(code){ var r=st.approved[code]; return {code:code, name:r.title||'', credits:Core.num(r.credits)}; })
    .filter(function(x){ return x.credits>0; });
  var aug={courses:cur.courses.slice(), requiredCredits:cur.requiredCredits}, assigned=[];
  Object.keys(cur).forEach(function(k){ if(!(k in aug)) aug[k]=cur[k]; });
  var slots=cur.courses.filter(function(c){ return c.type==='ELEC' && st.slots[c.code] && st.slots[c.code].status==='pending'; });
  function lang(x){ return ['SPAN','ENGL'].indexOf(x.code.split(' ')[0])>=0?1:0; }
  function kindOf(s){ var g=String(s.group||'').toUpperCase(); return g==='SOC'?0:g==='SOHU'?1:(g==='FREE'||g==='OPEN')?2:-1; }
  slots.filter(function(s){ return kindOf(s)>=0; }).sort(function(a,b){ return kindOf(a)-kindOf(b); }).forEach(function(s){
    var k=kindOf(s), subj=k===0?SOC_SUBJ:k===1?SOHU_SUBJ:null;
    var fit=left.filter(function(x){ return x.credits>=s.credits && (!subj || subj.indexOf(x.code.split(' ')[0])>=0); })
      .sort(function(a,b){ return (lang(a)-lang(b)) || (a.credits-b.credits); })[0];
    if(!fit) return;
    left.splice(left.indexOf(fit),1);
    aug.courses.push({code:fit.code,name:fit.name,credits:fit.credits,prereqs:[],coreqs:[],prereqText:'',coreqText:'',type:'OPC',group:s.group,minTerm:0,order:aug.courses.length,custom:true,auto:true,section:s.section||'Electivas'});
    assigned.push({slot:s.code, group:s.group, kind:elecKind(s.group)[1], code:fit.code, name:fit.name, credits:fit.credits});
  });
  return {cur:aug, assigned:assigned, unused:left};
}
function summaryFor(cur, exempt, sel){
  var st=Core.buildStatus(cur,S.records,S.plannerRules), satisfied=0, counted=[];
  cur.courses.forEach(function(c){
    if(c.type==='OPC') return;
    if(c.type==='PREP' && exempt.indexOf(c.code)>=0 && !st.approved[c.code]){ if(c.group==='CUENTA') satisfied+=c.credits; return; }
    var s=c.type==='ELEC'?st.slots[c.code]:st.byCode[c.code];
    if(s && s.status==='done'){ if(c.type!=='PREP'||c.group==='CUENTA') satisfied+=c.credits; counted.push(c.type==='ELEC'?s.filledBy:c.code); }
  });
  var plan=Core.generatePlan(cur,S.records,sel||{},prEff(),exempt);
  var ne=plan.terms.filter(function(t){return t.courses.length;});
  var todo=[]; ne.forEach(function(t){ t.courses.forEach(function(c){ if(c.grade!=='IP') todo.push(c); }); });
  plan.unscheduled.forEach(function(u){ todo.push(u); });
  return {required:cur.requiredCredits, satisfied:satisfied, pending:Math.max(0,cur.requiredCredits-satisfied), terms:ne.length,
    grad:ne.length?tS(ne[ne.length-1].label):'—', unscheduled:plan.unscheduled.length, counted:counted, plan:plan, todo:todo,
    todoCr:todo.reduce(function(s,c){ return s+Core.num(c.credits); },0)};
}
/** Todo lo necesario para comparar un programa con el historial del estudiante. */
function compareData(key){
  var base=curriculumFor(key); if(!base) return null;
  var isCur=key===S.program, ex=exemptList();
  if(!isCur) ex=ex.filter(function(c){ return base.courses.some(function(o){return o.code===c && o.type==='PREP';}); });
  var f=fillWithLeftovers(base);
  var sel=isCur?S.electiveSel:{};
  var sum; try{ sum=summaryFor(f.cur, ex, sel); }catch(e){ return null; }
  var approved=Core.buildStatus(null,S.records,S.plannerRules).approvedCodes;
  var inProg=approved.filter(function(c){ return base.courses.some(function(o){return o.code===c;}); });
  return {key:key, name:programName(key), isCur:isCur, cur:f.cur, base:base, assigned:f.assigned,
    unused:f.unused.map(function(x){return x.code;}), inProg:inProg, sum:sum};
}
function todoLabel(c){ return c.placeholder ? (c.name||c.code) : c.code; }
/** Divide lo que le falta en el otro programa: cursos que también necesitaría en su programa actual y cursos nuevos. */
function splitTodo(a, b){
  var curCodes={}; a.base.courses.forEach(function(c){ curCodes[c.code]=true; });
  var also=[], nuevos=[], elec={};
  b.sum.todo.forEach(function(c){
    if(c.placeholder){ var k=c.name||c.code; elec[k]=(elec[k]||0)+1; return; }
    (curCodes[c.code]?also:nuevos).push(c);
  });
  return {also:also, nuevos:nuevos, elec:Object.keys(elec).map(function(k){ return elec[k]>1?k+' (x'+elec[k]+')':k; })};
}

function compareAll(){

  return rows;
}

/** Cambia al programa comparado, guarda cómo estaba para poder deshacerlo y lleva las electivas acomodadas. */
function switchProgram(key){
  var d=compareData(key);
  S.prevProgram={program:S.program, programBase:S.programBase, electiveSel:clone(S.electiveSel||{}), plan:S.plan?clone(S.plan):null,
    planOriginal:S.planOriginal?clone(S.planOriginal):null, planEdited:S.planEdited, historyChanged:S.historyChanged, to:key};
  S.program=key; S.programBase=baseOf(key); S.electiveSel={};
  if(d && d.assigned.length){
    var list=(S.customOptions=S.customOptions||{})[key]=(S.customOptions[key]||[]);
    d.assigned.forEach(function(x){
      if(!list.some(function(o){return o.code===x.code;})) list.push({code:x.code,name:x.name,credits:x.credits,group:x.group});
      S.electiveSel[x.slot]=x.code;
    });
  }
  session.editMode=false; save(); regenerate(true);
  toast('Programa cambiado a '+programName(key)+'.');
}
function canUndoProgram(){ return !!(S.prevProgram && S.prevProgram.to===S.program); }
function undoProgram(){
  if(!canUndoProgram()){ toast('No hay un cambio de programa para deshacer.'); return; }
  var p=S.prevProgram, from=S.program;
  S.program=p.program; S.programBase=p.programBase; S.electiveSel=p.electiveSel||{};
  S.plan=p.plan; S.planOriginal=p.planOriginal; S.planEdited=!!p.planEdited; S.historyChanged=!!p.historyChanged;
  S.prevProgram=null; session.editMode=false; save();
  if(!S.plan && curr()) regenerate(true); else renderAll();
  toast('Volviste a '+programName(S.program)+' (antes estaba en '+programName(from)+').');
}

  html+='<div class="gpa-cmp">'+
    '<label><span class="k">GPA acumulado oficial</span><input id="offGPA" inputmode="decimal" value="'+(off==null?'':off)+'" placeholder="0.00"></label>'+
    '<div><label class="k" for="gpaCalcEdit">GPA calculado</label><input id="gpaCalcEdit" class="gpa-inline" style="font-size:24px" inputmode="decimal" value="'+(gpaOverride()!=null?fmt(gpaOverride()):(g.gpa==null?'':fmt(g.gpa)))+'" placeholder="—">'+

    '</div>';

  var verdict=(off!=null && Math.abs(diff||0)>=0.005) ? '<p class="verdict">'+(matches.length
    ? 'Estas reglas reproducen el GPA oficial: '+matches.map(function(m){return esc(lbl[m.repeatPolicy]+', preparatorios '+(m.includePrep?'incluidos':'excluidos')+', WF '+(m.wfPolicy==='asF'?'como F':'excluido'));}).join('; ')+'.'
    : 'Ninguna combinación de reglas reproduce el GPA oficial. Revisa abajo las notas y créditos: puede faltar un curso o haber un dato mal leído.')+'</p>' : '';
  html+='<details class="more"'+(session.rulesOpen?' open':'')+' id="rulesBox"><summary>Detalle interno del cálculo</summary>'+verdict+
    '<p class="formula">Puntos de calidad '+fmt(g.qualityPoints)+' ÷ créditos que cuentan '+fmtCr(g.gpaCredits)+' = <strong>'+fmt(g.gpa,3)+'</strong>'+

    '<div class="rules">'+
      '<label>Cursos repetidos<select data-gpa="repeatPolicy">'+['highest','latest','all'].map(function(v){return '<option value="'+v+'"'+(r.repeatPolicy===v?' selected':'')+'>'+lbl[v]+'</option>';}).join('')+'</select></label>'+
      '<label>Preparatorios (0xxx)<select data-gpa="includePrep"><option value="1"'+(r.includePrep?' selected':'')+'>Incluir en el GPA</option><option value="0"'+(!r.includePrep?' selected':'')+'>Excluir del GPA</option></select></label>'+
      '<label>WF<select data-gpa="wfPolicy"><option value="exclude"'+(r.wfPolicy==='exclude'?' selected':'')+'>Excluir del GPA</option><option value="asF"'+(r.wfPolicy==='asF'?' selected':'')+'>Contar como F</option></select></label>'+
    '</div>'+
    '<div style="overflow-x:auto"><table class="plain"><thead><tr><th>Repetidos</th><th>Preparatorios</th><th>WF</th><th class="num">Créditos GPA</th><th class="num">GPA</th></tr></thead><tbody>'+
      scen.map(function(s){return '<tr class="'+(s.match?'match':'')+'"><td>'+lbl[s.repeatPolicy]+'</td><td>'+(s.includePrep?'Incluir':'Excluir')+'</td><td>'+(s.wfPolicy==='asF'?'Como F':'Excluir')+'</td><td class="num">'+fmtCr(s.credits)+'</td><td class="num">'+fmt(s.gpa,3)+'</td></tr>';}).join('')+

      S.records.map(function(rec){ var x=rowsById[rec.id]||{}; return '<tr'+(x.counts?'':' style="color:var(--muted)"')+'><td>'+esc(rec.code)+'</td><td>'+esc(rec.grade)+'</td><td class="num">'+fmtCr(rec.credits)+'</td><td class="num">'+(x.counts?fmt(x.points):'—')+'</td><td>'+esc(x.reason||'')+'</td></tr>'; }).join('')+
    '</tbody></table></div></details>';
  html+='<h4 class="sec">Historial académico</h4><p class="small muted" style="margin:0 0 8px">Datos leídos del transcript'+(S.transcriptName?' ('+esc(S.transcriptName)+')':'')+'. Si algo se leyó mal, corrígelo con Editar.</p>';

    }).join('')+'</tbody></table>'+
    '<button class="btn link add" style="margin-top:8px" data-action="add-rec">+ Agregar curso al historial</button>';
  el.innerHTML=html;

function gradeOptions(sel, allowBlank){
  var list = allowBlank ? [''].concat(GRADE_LIST) : GRADE_LIST.slice();
  if(sel && list.indexOf(sel)<0) list.push(sel);
  return list.map(function(gr){ return '<option value="'+gr+'"'+(gr===sel?' selected':'')+'>'+(gr||'Planificado')+'</option>'; }).join('');
}

  renderStudent(); renderTabs();
  if(session.tab==='hist') renderHistory(); else renderPlan();
}

    '<div class="grid2"><label class="field">Créditos<input data-r="credits" inputmode="decimal" value="'+esc(rec.credits)+'"></label>'+

    '<datalist id="termList2">'+Core.Terms.sequence({season:'Fall',year:2015},60,true).map(function(x){return '<option value="'+Core.Terms.label(x)+'">';}).join('')+'</datalist>';
  var btns=[];
  if(!isNew) btns.push({label:'Eliminar', danger:true, left:true, onClick:function(){
    S.records=S.records.filter(function(r){return r.id!==id;}); markChanged(); save(); renderAll(); toast('Registro eliminado.'); }});

    var target = isNew ? {id:Core.uid(), order:S.records.length} : S.records.filter(function(r){return r.id===id;})[0];

    {label:'Eliminar clase', danger:true, left:true, onClick:function(){ setTimeout(function(){ deleteCourse(uid); },0); }},
    {label:'Cancelar'},
    {label:'Guardar', primary:true, onClick:function(b){

        }

function deleteCourse(uid){
  var f=findCourse(uid); if(!f) return;
  var dependents=[]; S.plan.terms.forEach(function(t){ t.courses.forEach(function(x){ (x.prereqs||[]).forEach(function(ors){ if(ors.length===1&&ors[0]===f.c.code) dependents.push(x.code); }); }); });
  var doIt=function(){ var g=findCourse(uid); if(!g) return; S.plan.terms[g.ti].courses.splice(g.ci,1); commitEdit(); toast(f.c.code+' eliminado del plan.'); };
  var w=[]; if(dependents.length) w.push(dependents.join(', ')+' requiere'+(dependents.length>1?'n':'')+' '+f.c.code+' como prerrequisito.');
  if(f.c.grade==='IP') w.push('Este curso está en progreso (IP) según el transcript.');

/* Créditos y títulos: si el transcript no los trae (0 o vacío), se usan los del currículo. */
function fillRecordsFromCurriculum(){
  var cur=curr(); if(!cur) return false;
  var by={}; cur.courses.forEach(function(c){ by[c.code]=c; });
  var changed=false;
  S.records.forEach(function(r){
    var c=by[Core.normCode(r.code)]; if(!c) return;
    if(!r.crManual && !(Core.num(r.credits)>0) && c.credits>0){ r.credits=c.credits; r.crFromCurr=true; changed=true; }
    var t=String(r.title||'').replace(/^(UG|GR|UN)\b\s*/i,'').trim();
    if(!t && c.name){ t=c.name; }
    if(t!==r.title){ r.title=t; changed=true; }
  });
  return changed;
}
function regenerate(silent){
  fillRecordsFromCurriculum();
  var cur=curr();
  if(!cur){ toast('Carga el currículo del programa primero.'); return; }

  catch(err){ showError('No se pudo generar el plan', err); return; }
  S.plan=plan; S.planOriginal=clone(plan); S.planEdited=false; S.historyChanged=false;

/* ---------------- Lectura de archivos ---------------- */
function readFileAsArrayBuffer(file){ return file.arrayBuffer ? file.arrayBuffer() : new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsArrayBuffer(file); }); }
function readFileAsText(file){ return file.text ? file.text() : new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsText(file); }); }
function pdfToText(buf){
  if(!window.pdfjsLib) return Promise.reject(new Error('No se pudo cargar el lector de PDF.'));
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
    var pages=[]; for(var i=1;i<=pdf.numPages;i++) pages.push(i);
    return pages.reduce(function(p,n){ return p.then(function(acc){
      return pdf.getPage(n).then(function(page){ return page.getTextContent(); }).then(function(tc){
        var items=tc.items.filter(function(it){return it.str && it.str.trim();}).map(function(it){return {x:it.transform[4],y:it.transform[5],s:it.str};});
        items.sort(function(a,b){ return (b.y-a.y) || (a.x-b.x); });
        var lines=[], cur=null;
        items.forEach(function(it){
          if(!cur || Math.abs(cur.y-it.y)>3){ cur={y:it.y,items:[]}; lines.push(cur); }
          cur.items.push(it);
        });
        lines.forEach(function(l){ l.items.sort(function(a,b){return a.x-b.x;}); acc.push(l.items.map(function(i){return i.s.trim();}).join(' ')); });
        return acc;
      });
    }); }, Promise.resolve([])).then(function(all){ return all.join('\n'); });
  });
}
function parseCSVTranscript(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var recs=[];
  lines.forEach(function(l){
    var c=l.split(/[,;\t]/).map(function(s){return s.trim().replace(/^"|"$/g,'');});
    if(!Core.isCourseCode(c[0])) return;
    recs.push({id:Core.uid(),code:Core.normCode(c[0]),title:c[1]||'',credits:Core.num(c[2]),grade:(c[3]||'').toUpperCase(),term:c[4]||'',order:recs.length});
  });
  return recs;
}
function looksCSV(text){
  var ls=text.split(/\r?\n/).filter(function(l){return l.trim();}).slice(0,8);
  return ls.length && ls.filter(function(l){ return /^[^,;\t]+[,;\t][^,;\t]*[,;\t]\s*\d/.test(l) && Core.isCourseCode(l.split(/[,;\t]/)[0]); }).length >= Math.min(2,ls.length);
}

function openTranscript(){

      '<div class="row" style="margin-bottom:12px"><button class="btn primary" data-pick>Elegir archivo</button><span class="small muted" data-fname>Ningún archivo seleccionado</span></div>'+
      '<div class="field">O pega el texto del transcript<textarea rows="8" data-paste placeholder="Código  Título  Créditos  Nota"></textarea></div>'+
      '<p class="small muted">Formato CSV aceptado: código, título, créditos, nota, término.</p><div data-msg></div>',
    buttons:[{label:'Cancelar'},{label:'Leer texto pegado',primary:true,onClick:function(body){
      var t=body.querySelector('[data-paste]').value;
      if(!t.trim()){ body.querySelector('[data-msg]').innerHTML='<div class="notice bad">Pega el texto del transcript o elige un archivo.</div>'; return false; }
      session.pdfData=null; applyTranscriptText(t,'texto pegado'); }}]
  });
  m.body.querySelector('[data-pick]').addEventListener('click',function(e){

    input.onchange=function(){

        m.body.querySelector('[data-msg]').innerHTML='<div class="notice bad">'+esc(err.message||'No se pudo leer el archivo.')+'</div>';
      });
