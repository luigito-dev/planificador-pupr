function handleTranscriptFile(f){
  if(/\.(xlsx|xlsm|xls)$/i.test(f.name)) return importAuditFile(f);
  var isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
  if(isPdf){
    return readFileAsArrayBuffer(f).then(function(buf){
      session.pdfData=buf.slice(0);
      return pdfToText(buf.slice(0));
    }).then(function(text){ applyTranscriptText(text,f.name); });
  }
  return readFileAsText(f).then(function(text){ session.pdfData=null; applyTranscriptText(text,f.name); });
}
function applyTranscriptText(text,name){
  var parsed;
  if(looksCSV(text)) parsed={student:{name:'',program:''},records:parseCSVTranscript(text),officialGPA:null};
  else parsed=Core.parseTranscriptText(text);
  if(!parsed.records.length) throw new Error('No se encontraron cursos en '+name+'. Verifica que el archivo tenga texto seleccionable o pega el contenido.');
  S.records=parsed.records; S.transcriptText=text; S.transcriptName=name;
  if(parsed.student.name) S.student.name=parsed.student.name;
  if(parsed.student.id) S.student.id=parsed.student.id;
  if(parsed.officialGPA!=null) S.officialGPA=parsed.officialGPA;
  S.officialTotals=parsed.officialTotals||null;
  if(parsed.student.program && !S.program){
    var hit=PROGRAMS.filter(function(p){ return p.toLowerCase().split(' ')[0]===parsed.student.program.toLowerCase().split(' ')[0] && parsed.student.program.toLowerCase().indexOf(p.toLowerCase().split(' - ')[0].split(' ').slice(-1)[0])>=0; })[0];
    if(hit){ S.program=hit; S.programBase=baseOf(hit); }
  }
  save();
  if(curr()) regenerate(true); else renderAll();
  session.tab='hist'; renderAll();
  toast('Se leyeron '+parsed.records.length+' cursos. Revisa el historial.');
}
function viewTranscript(){
  var wrap=document.createElement('div');
  if(session.pdfData && window.pdfjsLib){
    wrap.innerHTML='<p class="muted small">Cargando páginas…</p>';
    window.pdfjsLib.getDocument({data:new Uint8Array(session.pdfData.slice(0))}).promise.then(function(pdf){
      wrap.innerHTML='';
      var chain=Promise.resolve();
      for(var i=1;i<=pdf.numPages;i++) (function(n){ chain=chain.then(function(){ return pdf.getPage(n).then(function(page){
        var vp=page.getViewport({scale:1.5}); var cv=document.createElement('canvas'); cv.className='pdfpage';
        cv.width=vp.width; cv.height=vp.height; wrap.appendChild(cv);
        return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; }); }); })(i);
    }).catch(function(){ wrap.innerHTML='<pre class="raw">'+esc(S.transcriptText)+'</pre>'; });
  } else {
    wrap.innerHTML='<p class="small muted" style="margin-top:0">Texto leído de '+esc(S.transcriptName||'el transcript')+'. El archivo original se muestra sólo durante la sesión en que se cargó.</p><pre class="raw">'+esc(S.transcriptText)+'</pre>';
  }
  modal({title:'Transcript'+(S.transcriptName?': '+S.transcriptName:''), body:wrap});
}

/* ---------------- Currículo (vista tipo Degree Audit) ---------------- */
function recordFor(code){
  var recs=S.records.filter(function(r){ return Core.normCode(r.code)===code; });
  if(!recs.length) return null;
  var rank={A:4,B:3,C:2,D:1,T:3.5,CE:3.5,P:3.5};
  var best=null;
  recs.forEach(function(r){ var g=String(r.grade).toUpperCase(); if(rank[g]!=null && (!best || rank[g]>rank[String(best.grade).toUpperCase()])) best=r; });
  if(best) return best;
  var ip=recs.filter(function(r){return String(r.grade).toUpperCase()==='IP';})[0];
  return ip || recs.slice().sort(function(a,b){return (b.order||0)-(a.order||0);})[0];
}
function statusOf(grade){
  grade=String(grade||'').toUpperCase();
  if(['A','B','C','D','T','CE','P'].indexOf(grade)>=0) return 'ok';
  if(grade==='IP') return 'ip';
  if(['IF','ID','IC'].indexOf(grade)>=0) return 'inc';
  if(grade==='F'||grade==='WF'||grade==='W') return 'fail';
  return '';
}
function setManualGrade(code, grade, term){
  var cur=curr(); var course=cur && cur.courses.filter(function(c){return c.code===code;})[0];
  var recs=S.records.filter(function(r){ return Core.normCode(r.code)===code; }).sort(function(a,b){return (b.order||0)-(a.order||0);});
  var target=recs[0];
  if(!grade){ if(target) S.records=S.records.filter(function(r){return r!==target;}); }
  else if(target){ target.grade=grade; if(term!=null) target.term=term; }
  else S.records.push({id:Core.uid(),code:code,title:course?course.name:'',credits:course?course.credits:0,grade:grade,term:term||'',order:S.records.length,manual:true});
  session.auditChanged=true; save();
}

    '<table class="sh"><colgroup><col style="width:104px"><col style="width:108px"><col><col style="width:42px"><col style="width:52px"><col style="width:86px"><col style="width:150px"><col style="width:104px"></colgroup>'+

  var courseCells=function(c, codeCell, titleExtra){

    var notes=(c.prereqText||'').split(',').map(function(x){return x.trim();}).filter(function(x){return x && !Core.isCourseCode(x);});
    var pre=reqs(c.prereqs)+(notes.length?((c.prereqs||[]).length?', ':'')+'<span class="nt">'+esc(notes.join(', '))+'</span>':'');
    return {s:statusOf(g), html:'<td class="cd">'+codeCell+'</td><td class="tt">'+esc(c.name||'')+titleExtra+'</td><td class="c">'+fmtCr(c.credits)+'</td>'+
      '<td class="c gr">'+gradeSel(c.code,g,false)+'</td>'+
      '<td class="tm"><input data-at aria-label="Término de '+esc(c.code)+'" value="'+esc(rec?tS(rec.term):'')+'"'+(rec?' placeholder="FA 2025"':' disabled')+' list="termList"></td>'+
      '<td class="pr">'+pre+'</td><td class="pr">'+reqs(c.coreqs)+'</td>'};
  };
  sections.forEach(function(sec, si){
    var list=bySec[sec];

    var rows=list.filter(function(c){return c.type!=='ELEC' && c.type!=='OPC';});

    }
    if(!trs.length) return;
    var th='<th class="sec" rowspan="'+trs.length+'" scope="rowgroup"><span>'+esc(sec)+'</span>'+(note?'<small>'+note.split(' | ').map(esc).join('<br>')+'</small>':'')+'</th>';
    trs[0]=trs[0].replace(/^(<tr[^>]*>)/,'$1'+th);
    html+='<tbody class="sh-sec">'+trs.join('')+'</tbody>';
  });
  html+='</table>';
  html+='<table class="sh-tot"><tr><td>Créditos del programa</td><td>'+fmtCr(cur.requiredCredits)+'</td></tr>'+
    '<tr><td>Créditos aprobados</td><td>'+fmtCr(cur.requiredCredits-(a.pending||0))+'</td></tr>'+
    '<tr class="b"><td>Créditos que faltan</td><td>'+fmtCr(a.pending||0)+'</td></tr>'+
    groupsInfo.map(function(gi){ return '<tr><td>'+esc(gi.name)+': faltan</td><td>'+fmtCr(Math.max(0,gi.need-gi.done))+' de '+fmtCr(gi.need)+'</td></tr>'; }).join('')+
    '</table></div>';
  var terms=Core.Terms.sequence({season:'Fall',year:2015},60,true).map(Core.Terms.label);
  html+='<datalist id="termList">'+terms.map(function(t){return '<option value="'+t+'">';}).join('')+'</datalist>';
  return html;
}
function placeWrittenElective(slotCode, code, nm, crv){
  var cu=curr(), slotC=cu.courses.filter(function(x){return x.code===slotCode;})[0];
  var ex2=cu.courses.filter(function(x){return x.code===code;})[0];
  var list=(S.customOptions=S.customOptions||{})[S.program]=(S.customOptions[S.program]||[]);
  if(ex2 && !(ex2.type==='OPC' && ex2.group===slotC.group)){
    if(ex2.custom){
      // Estaba escrito en otro tipo de electiva: se mueve a este espacio
      list.forEach(function(o){ if(o.code===code){ o.group=slotC.group; if(nm) o.name=nm; if(crv) o.credits=crv; } });
      Object.keys(S.electiveSel).forEach(function(k){ if(S.electiveSel[k]===code) delete S.electiveSel[k]; });
      S.electiveSel[slotCode]=code;
      return {ok:true, moved:elecKind(ex2.group)[1]};
    }
    if(ex2.type==='OPC') return {ok:false, msg:code+' está en la lista de '+elecKind(ex2.group)[1].toLowerCase()+'. Escógelo allí.'};
    return {ok:false, msg:code+' ya está en el currículo como curso requerido.'};
  }
  if(!ex2) list.push({code:code,name:nm,credits:crv,group:slotC.group});
  Object.keys(S.electiveSel).forEach(function(k){ if(S.electiveSel[k]===code) delete S.electiveSel[k]; });
  S.electiveSel[slotCode]=code;
  return {ok:true};
}
/* ---------------- Aplicar cambios de notas/electivas a un plan editado a mano ---------------- */
function syncPlanWithRecords(){
  var cur=curr(); if(!cur || !S.plan) return {removed:[], replaced:[]};
  var st=Core.buildStatus(cur,S.records,S.plannerRules), ex=exemptList(), by={};
  cur.courses.forEach(function(c){ by[c.code]=c; });
  var inPlan={}; S.plan.terms.forEach(function(t){ t.courses.forEach(function(c){ inPlan[c.code]=true; }); });
  var removed=[], replaced=[];
  S.plan.terms.forEach(function(t){
    t.courses=t.courses.filter(function(c){
      var slotSt=c.slot && st.slots[c.slot];
      if(c.placeholder && slotSt && slotSt.status!=='pending'){ removed.push(c.code+' → '+slotSt.filledBy); return false; }
      if(!c.placeholder && (st.approved[c.code] || (c.type==='PREP' && ex.indexOf(c.code)>=0))){ removed.push(c.code); return false; }
      return true;
    });
    t.courses=t.courses.map(function(c){
      if(!c.slot) return c;
      var sel=S.electiveSel[c.slot];
      if(!sel || sel===c.code || !by[sel] || st.approved[sel] || (inPlan[sel] && sel!==c.code)) return c;
      var o=by[sel];
      replaced.push((c.placeholder?c.name:c.code)+' → '+sel); inPlan[sel]=true;
      return {uid:Core.uid(), code:o.code, name:o.name, credits:o.credits, type:o.type, prereqs:o.prereqs||[], coreqs:o.coreqs||[], prereqText:o.prereqText||'', grade:'', placeholder:false, fixed:false, slot:c.slot, offer:o.offer||null};
    });
  });
  return {removed:removed, replaced:replaced};
}

        buttons:[{label:'Cancelar'},{label:'Eliminar',primary:true,danger:true,onClick:function(){
          delete S.electiveSel[sc2];
          Object.keys(S.electiveSel).forEach(function(k){ if(S.electiveSel[k]===code2) delete S.electiveSel[k]; });
          if(S.customOptions[S.program]) S.customOptions[S.program]=S.customOptions[S.program].filter(function(o){return o.code!==code2;});
          S.records=S.records.filter(function(r){ return !(Core.normCode(r.code)===code2 && r.manual); });

function findCourse(uid){
  for(var i=0;i<S.plan.terms.length;i++){ var t=S.plan.terms[i]; for(var j=0;j<t.courses.length;j++) if(t.courses[j].uid===uid) return {ti:i,ci:j,c:t.courses[j]}; }
  return null;
}
function addNewTerm(){
  var last=S.plan.terms[S.plan.terms.length-1];
  var nt=last? Core.Terms.next(last,S.plannerRules.includeSummer) : {season:S.plannerRules.startSeason,year:+S.plannerRules.startYear};
  S.plan.terms.push({season:nt.season,year:nt.year,label:Core.Terms.label(nt),courses:[]});
  return S.plan.terms.length-1;
}
function commitEdit(){ S.planEdited=true; save(); renderAll(); }
function moveCourse(uid, target, selectEl){
  var f=findCourse(uid); if(!f) return;
  var idx = target==='new' ? S.plan.terms.length : +target;
  var probe=clone(S.plan);
  if(target==='new'){ var last=probe.terms[probe.terms.length-1]; var nt=Core.Terms.next(last,S.plannerRules.includeSummer); probe.terms.push({season:nt.season,year:nt.year,label:Core.Terms.label(nt),courses:[]}); }
  probe.terms[f.ti].courses.splice(f.ci,1);
  var w=Core.validatePlacement(probe, f.c, idx, baseDone(), prEff());
  function doIt(){
    if(target==='new') idx=addNewTerm();
    S.plan.terms[f.ti].courses.splice(f.ci,1);
    S.plan.terms[idx].courses.push(f.c);
    commitEdit();
  }
  if(w.length) confirmWarnings(w, doIt, function(){ if(selectEl) selectEl.value=String(f.ti); });
  else doIt();
}

/* ---------------- Importar Degree Audit (Excel) ---------------- */
var TERM_SEASON={FA:'Fall',FALL:'Fall',WI:'Winter',WINTER:'Winter',SP:'Spring',SPRING:'Spring',SU:'Summer',SUMMER:'Summer',OTONO:'Fall','OTOÑO':'Fall',INVIERNO:'Winter',PRIMAVERA:'Spring',VERANO:'Summer'};
function fmtTerm(v){ var s=String(v==null?'':v).trim(); return s?Core.Terms.short(s):''; }
function cellStr(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim(); }
function parseAuditWorkbook(wb){
  var best=null;
  wb.SheetNames.forEach(function(name){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});
    var h=-1,cCode=-1,cGrade=-1,cTerm=-1,cCr=-1,cTitle=-1;
    for(var i=0;i<Math.min(rows.length,60) && h<0;i++){
      var r=rows[i].map(cellStr);
      var g=r.findIndex(function(x){return /^(grade|nota|final grade|calificaci[oó]n)$/i.test(x);});
      var c=r.findIndex(function(x){return /^(course code|course|c[oó]digo|curso|number)$/i.test(x);});
      if(g>=0 && c>=0){ h=i; cGrade=g; cCode=c;
        cTerm=r.findIndex(function(x){return /^(term|t[eé]rmino|date passed|trimestre)$/i.test(x);});
        cCr=r.findIndex(function(x){return /^(crs\.?|cr|cr[eé]ditos|credits|crd\.?)$/i.test(x);});
        cTitle=r.findIndex(function(x){return /(title|t[ií]tulo|name|nombre del curso)/i.test(x);});
      }
    }
    var name='', sid='';
    for(var j=0;j<(h>=0?h:Math.min(rows.length,15));j++){
      var rr=rows[j].map(cellStr);
      for(var k=0;k<rr.length;k++){
        if(/^(student( name)?|estudiante|nombre|name)\s*:?$/i.test(rr[k])){
          for(var q=k+1;q<rr.length;q++){ if(rr[q] && !/:$/.test(rr[q])){ name=rr[q]; break; } }
        }
        if(/^(student\s*(#|no\.?|number|id)|n[úu]m(ero)?\.?\s*(de\s*)?estudiante|id)\s*:?$/i.test(rr[k])){
          for(var q2=k+1;q2<rr.length;q2++){ if(rr[q2] && !/:$/.test(rr[q2])){ sid=rr[q2]; break; } }
        }
      }
    }
    var recs=[];
    rows.forEach(function(row,i){
      if(h>=0 && i<=h) return;
      var r=row.map(cellStr), code, grade, term='', cr=0, title='';
      if(h>=0){
        code=r[cCode]; grade=(r[cGrade]||'').toUpperCase(); term=cTerm>=0?r[cTerm]:''; cr=cCr>=0?Core.num(r[cCr]):0; title=cTitle>=0?r[cTitle]:'';
      } else {
        var ci=r.findIndex(function(x){return /^[A-Z]{2,5} ?\d{4}[A-Z]?$/.test(x.toUpperCase());}); if(ci<0) return;
        code=r[ci]; var gi=r.findIndex(function(x,ix){return ix!==ci && GRADE_LIST.indexOf(x.toUpperCase())>=0;}); if(gi<0) return;
        grade=r[gi].toUpperCase(); var ti=r.findIndex(function(x){return fmtTerm(x)!==x;}); term=ti>=0?r[ti]:''; title=r[ci+1]||'';
        var ni=r.findIndex(function(x,ix){return ix>ci && /^\d{1,2}(\.\d+)?$/.test(x);}); cr=ni>=0?Core.num(r[ni]):0;
      }
      if(!code || !Core.isCourseCode(code) || GRADE_LIST.indexOf(grade)<0) return;
      recs.push({id:Core.uid(),code:Core.normCode(code),title:title,credits:cr,grade:grade,term:fmtTerm(term),order:recs.length,source:'audit'});
    });
    if(!best || recs.length>best.records.length) best={sheet:name,name:name?name:'',records:recs,student:name,studentId:sid};
  });
  return best||{records:[]};
}
function importAuditFile(f){
  if(!window.XLSX) return Promise.reject(new Error('No se pudo cargar el lector de Excel.'));
  return readFileAsArrayBuffer(f).then(function(buf){
    var wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    var res=parseAuditWorkbook(wb);
    if(!res.records.length) throw new Error('No se encontraron cursos con nota en '+f.name+'. Verifica que las notas estén en la columna "Grade".');
    // Créditos: si el Excel no los trae, se usan los del currículo
    var cur=curr(), by={}; if(cur) cur.courses.forEach(function(c){by[c.code]=c;});
    res.records.forEach(function(r){ var c=by[r.code]; if(c){ if(!r.credits) r.credits=c.credits; if(!r.title) r.title=c.name; } });
    function apply(){
      S.records=res.records; S.transcriptName=f.name; session.pdfData=null;
      S.transcriptText='Degree Audit importado: '+f.name+' (hoja '+res.sheet+')\n\n'+res.records.map(function(r){return [r.term,r.code,r.title,r.credits,r.grade].join('  ');}).join('\n');
      if(res.student) S.student.name=res.student;
      if(res.studentId) S.student.id=res.studentId;
      markChanged(); save();
      if(curr()) regenerate(true); else renderAll();
      session.tab='hist'; renderAll();
      toast('Se importaron '+res.records.length+' cursos del Degree Audit.');
    }
    if(S.records.length){
      modal({title:'Importar Degree Audit', narrow:true, body:'<p style="margin-top:0">El historial actual tiene '+S.records.length+' cursos. Se reemplazará con los '+res.records.length+' cursos del Excel.</p>',
        buttons:[{label:'Cancelar'},{label:'Reemplazar',primary:true,onClick:function(){ apply(); }}]});
    } else apply();
  });
}
function pickAuditFile(onErr){
  var input=$('fileAudit'); input.value='';
  input.onchange=function(){ var f=input.files[0]; if(!f) return; importAuditFile(f).catch(function(err){ if(onErr) onErr(err); else showError('No se pudo importar', err); }); };
  input.click();
}

/* ---------------- PDF ---------------- */
function getDownloads(){
  if(session.downloads!==null && session.downloads!==undefined) return Promise.resolve(session.downloads);
  if(!window.claude || !window.claude.use) return Promise.resolve(null);
  return window.claude.use('downloads').then(function(d){ session.downloads=d; return d; });
}
function saveFile(filename, blob){
  return getDownloads().then(function(d){
    if(!d){
      // Fuera de Claude (archivo propio o sitio web): descarga normal del navegador
      try{
        var url=URL.createObjectURL(blob instanceof Blob?blob:new Blob([blob]));
        var link=document.createElement('a'); link.href=url; link.download=filename; document.body.appendChild(link); link.click();
        setTimeout(function(){ URL.revokeObjectURL(url); link.remove(); },1500);
        toast('Archivo descargado: '+filename);
      }catch(e){ toast('No se pudo descargar el archivo.'); }
      return;
    }
    return d.save({filename:filename, data:blob}).then(function(){ toast('Archivo guardado: '+filename); })
      .catch(function(err){
        var code=err&&err.code;
        if(code==='declined') return;
        if(code==='rate_limited') toast('Ya hay una descarga pendiente de confirmar.');
        else toast('No se pudo descargar el archivo'+(err&&err.message?': '+err.message:'.'));
      });
  });
}
function pdfDoc(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('No se pudo cargar el generador de PDF.'); return null; }
  var doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'});
  if(typeof doc.autoTable!=='function'){ toast('No se pudo cargar el generador de tablas del PDF.'); return null; }
  return doc;
}
function pdfSafe(s){ return String(s==null?'':s).replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'"); }

/** Pie del template a color: azul #003399 con viñetas amarillas #FFC000 (círculos dibujados). */
function pdfFooter(doc, W, H){
  var blue=[0,51,153], gold=[255,192,0];
  function line(parts, y, size, style, dotColor){
    doc.setFont('times', style); doc.setFontSize(size);
    var r=size*0.2, gap=size*0.45, dotW=2*r+2*gap;
    var total=parts.reduce(function(s,p,i){ return s+doc.getTextWidth(p)+(i?dotW:0); },0), x=(W-total)/2;
    parts.forEach(function(p,i){
      if(i){ doc.setFillColor.apply(doc,dotColor); doc.circle(x+gap+r, y-size*0.3, r, 'F'); x+=dotW; }
      doc.setTextColor.apply(doc,blue); doc.text(p, x, y); x+=doc.getTextWidth(p);
    });
  }
  line(['SAN JUAN','ORLANDO','ONLINE'], H-30, 11, 'bold', gold);
  line(['PO Box 192017','San Juan, PR  00919-2017','787.622.8000','www.pupr.edu'], H-18, 8.5, 'normal', blue);
}
/** Membrete como el template de la universidad: logo, nombre al centro, dirección a la derecha y pie. Se aplica a todas las páginas. */
function pdfLetterhead(doc){
  var n=doc.internal.getNumberOfPages(), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=36;
  for(var p=1;p<=n;p++){
    doc.setPage(p);
    var lh=pdfLogo(doc, M, 24, 132);
    doc.setFont('times','bold'); doc.setFontSize(12); doc.setTextColor(20,20,20);
    doc.text('Universidad Politécnica de Puerto Rico', W/2, 24+lh/2+4, {align:'center'});
    var ax=W-M-104, ay=24;
    doc.setDrawColor(242,183,5); doc.setLineWidth(1.2); doc.line(ax-6, ay, ax-6, ay+38);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(52,74,140);
    ['377 Ave. Ponce de León','Hato Rey, PR 00918','(787) 622-8000','info@pupr.edu','www.pupr.edu'].forEach(function(t,i){ doc.text(t, ax, ay+5+i*8.2); });
    doc.setLineWidth(0.5); doc.setDrawColor(221,227,232); doc.line(M, LH_TOP-14, W-M, LH_TOP-14);
    pdfFooter(doc, W, H);
  }
}
/** Logo de la Universidad Politécnica en la parte superior del documento. Devuelve la altura usada. */
function pdfLogo(doc, x, y, w){

}
function studentBlock(doc, y){

function drawColoredParts(doc, parts, cell){

  var fs=cell.styles.fontSize, lh=fs*1.15, x=x0, y=cell.y+cell.padding('top')+fs*0.85;
  doc.setFontSize(fs);
  parts.forEach(function(p){
    var bold=p.k!=='note'; doc.setFont('helvetica', bold?'bold':'normal');
    doc.setTextColor.apply(doc, hexRGB(PRE_COLORS[p.k]||PRE_COLORS.note));
    pdfSafe(p.t).split(/(\s+)/).forEach(function(w){
      if(!w) return;

  });

}

    if(winP.idx.indexOf(ti)<0) return;
    if(y>660){ doc.addPage(); y=LH_TOP+10; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(28,42,57);
    doc.text(tS(t.label), 54, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,110,120);
    doc.text(fmtCr(Core.termCredits(t))+' créditos', 612-54, y, {align:'right'});
    doc.autoTable(Object.assign({}, TABLE_STYLE, {startY:y+6,
      head:[['Curso','Descripción','Créditos','Estado/Nota','Prerrequisito']],
      body:t.courses.map(function(c){ var eg=planElecGroup(c,curP,sgP); return [c.code, pdfSafe(c.name)+(eg?' ['+elecKind(eg)[1]+']':'')+(c.placeholder?' (por seleccionar)':''), fmtCr(c.credits), c.grade||'', pdfSafe(prereqParts(c,stPdf).map(function(p){return p.t;}).join(''))]; }),
      columnStyles:{0:{cellWidth:70,fontStyle:'bold'},2:{cellWidth:50,halign:'right'},3:{cellWidth:62},4:{cellWidth:110}},
      didParseCell:function(d){ if(d.section==='body' && d.column.index===4) d.cell.styles.textColor=[255,255,255]; },
      didDrawCell:function(d){
        if(d.section!=='body' || d.column.index!==4) return;
        var c=t.courses[d.row.index]; if(!c) return;
        drawColoredParts(doc, prereqParts(c,stPdf), d.cell);
      }
    }));
    y=doc.lastAutoTable.finalY+24;
  });
  if(winP.limited){
    if(y>640){ doc.addPage(); y=LH_TOP+10; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(28,42,57); doc.text('Cursos pendientes para trimestres futuros', 54, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100,110,120);
    doc.text(winP.rest.length+' cursos, '+fmtCr(winP.restCr)+' créditos', 612-54, y, {align:'right'});
    doc.autoTable(Object.assign({}, TABLE_STYLE, {startY:y+6, head:[['Curso','Descripción','Créditos']],
      body:winP.rest.map(function(c){ var eg=planElecGroup(c,curP,sgP); return [c.code, pdfSafe(c.name)+(eg?' ['+elecKind(eg)[1]+']':''), fmtCr(c.credits)]; }),
      columnStyles:{0:{cellWidth:70,fontStyle:'bold'},2:{cellWidth:50,halign:'right'}}}));
    y=doc.lastAutoTable.finalY+24;
  }
  if(S.plan.unscheduled.length){
    if(y>660){ doc.addPage(); y=LH_TOP+10; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Cursos por ubicar', 54, y);
    doc.autoTable(Object.assign({}, TABLE_STYLE, {startY:y+6, head:[['Curso','Descripción','Créditos','Motivo']],
      body:S.plan.unscheduled.map(function(u){return [u.code,pdfSafe(u.name),fmtCr(u.credits),pdfSafe(u.reason)];})}));
  }
  pdfLetterhead(doc);
  saveFile(fileBase()+' - Plan.pdf', doc.output('blob'));
}
function exportTranscriptPDF(){
  var doc=pdfDoc(); if(!doc) return;
  var y=studentBlock(doc,LH_TOP+10), cur=curr();
  var g=gpaResult(); var rowsById={}; g.rows.forEach(function(r){rowsById[r.ref.id]=r;});
  var completed=S.records.filter(function(r){ return String(r.grade).toUpperCase()!=='IP'; });
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(28,42,57); doc.text('Cursos completados', 54, y);
  doc.autoTable(Object.assign({}, TABLE_STYLE, {startY:y+6, head:[['Término','Curso','Descripción','Créditos','Nota']],
    body:completed.map(function(r){ return [tS(r.term||''), r.code, pdfSafe(r.title), fmtCr(r.credits), r.grade]; }),
    columnStyles:{0:{cellWidth:78},1:{cellWidth:70,fontStyle:'bold'},3:{cellWidth:50,halign:'right'},4:{cellWidth:40}}}));
  y=doc.lastAutoTable.finalY+26;
  var pending=[];
  S.records.filter(function(r){return String(r.grade).toUpperCase()==='IP';}).forEach(function(r){ pending.push([r.code,pdfSafe(r.title),fmtCr(r.credits),'IP']); });
  if(cur){
    var st=Core.buildStatus(cur,S.records,S.plannerRules);
    cur.courses.forEach(function(c){
      if(c.type==='OPC') return;
      var s=c.type==='ELEC'?st.slots[c.code]:st.byCode[c.code];
      if(c.type==='PREP' && exemptList().indexOf(c.code)>=0) return;
      if(s && s.status==='pending') pending.push([c.code,pdfSafe(c.name),fmtCr(c.credits),'Pendiente']);
    });
  }
  if(y>660){ doc.addPage(); y=LH_TOP+10; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.text('Cursos pendientes', 54, y);
  doc.autoTable(Object.assign({}, TABLE_STYLE, {startY:y+6, head:[['Curso','Descripción','Créditos','Estado']],
    body:pending.length?pending:[['','Sin cursos pendientes registrados.','','']],
    columnStyles:{0:{cellWidth:70,fontStyle:'bold'},2:{cellWidth:50,halign:'right'},3:{cellWidth:62}}}));
  pdfLetterhead(doc);
  saveFile(fileBase()+' - Transcript.pdf', doc.output('blob'));
}
function fileBase(){ return (S.student.name||'Estudiante').replace(/[\\\/:*?"<>|]/g,'').trim()||'Estudiante'; }

/* ---------------- Ajustes ---------------- */
function openSettings(){
  var p=S.plannerRules;
  var body='<h4 style="margin:0 0 8px">Planificación</h4><div class="grid2">'+
    '<label class="field">Primer término del plan<select data-s="startSeason">'+[['Fall','FA'],['Winter','WI'],['Spring','SP'],['Summer','SU']].map(function(x){return '<option value="'+x[0]+'"'+(p.startSeason===x[0]?' selected':'')+'>'+x[1]+' ('+x[0]+')</option>';}).join('')+'</select></label>'+
    '<label class="field">Año<input data-s="startYear" inputmode="numeric" value="'+p.startYear+'"></label>'+

    '<label class="field">Mínimo por término (beca)<input data-s="minCredits" inputmode="numeric" value="'+p.minCredits+'"></label>'+
    '<label class="field">Máximo en Summer<input data-s="summerMax" inputmode="numeric" value="'+p.summerMax+'"></label>'+
    '</div><details class="more"><summary>Reglas del planificador</summary><div class="grid2">'+
    '<label class="field">Carga máxima con proyecto/capstone<input data-s="finalLoadMax" inputmode="numeric" value="'+p.finalLoadMax+'"></label>'+
    '<label class="field">Proyecto cuando falten ≤ créditos<input data-s="capWindowCredits" inputmode="numeric" value="'+p.capWindowCredits+'"></label>'+
    '<label class="field">Materias con prioridad<input data-s="prioritySubjects" value="'+esc(p.prioritySubjects)+'"></label>'+
    '<label class="field">Solo un curso por término de<input data-s="onePerTermSubjects" value="'+esc(p.onePerTermSubjects||'')+'" placeholder="MATH"></label>'+
    '<label class="field">Término con cursos en progreso (IP)<select data-s="ipTermOnly"><option value="1"'+(p.ipTermOnly!==false?' selected':'')+'>Solo los cursos IP</option><option value="0"'+(p.ipTermOnly===false?' selected':'')+'>Permitir otros cursos</option></select></label>'+
    '</div></details><details class="more"><summary>Probatoria académica</summary><div class="grid2">'+
    '<label class="field">GPA mínimo (probatoria por debajo)<input data-s="minGPA" inputmode="decimal" value="'+(p.minGPA!=null?p.minGPA:2)+'"></label>'+
    '<label class="field">Aviso de GPA (hasta)<input data-s="gpaWarn" inputmode="decimal" value="'+(p.gpaWarn!=null?p.gpaWarn:2.1)+'"></label>'+
    '<label class="field">% mínimo aprobados/intentados<input data-s="minRate" inputmode="decimal" value="'+(p.minRate!=null?p.minRate:66)+'"></label>'+
    '<label class="field">Aviso de % (por debajo de)<input data-s="rateWarn" inputmode="decimal" value="'+(p.rateWarn!=null?p.rateWarn:70)+'"></label>'+
    '</div></details><details class="more"><summary>Otras reglas</summary><div class="grid2">'+
    '<label class="field">Nota mínima para aprobar prerrequisitos<select data-s="minGradeForReq">'+['D','C'].map(function(x){return '<option'+(p.minGradeForReq===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label>'+
    '</div></details>'+
    '<p class="small muted">Las reglas no confirmadas por la institución quedan aquí para ajustarlas. El término mínimo de cada curso (por ejemplo IE 1611 o las electivas de ME) se define en la columna 8 del currículo y se cuenta desde el primer término del plan.</p>';
  var m=modal({title:'Ajustes', body:body, buttons:[{label:'Cancelar'},{label:'Guardar',primary:true,onClick:function(b){
    var v=function(k){ return b.querySelector('[data-s="'+k+'"]').value; };
    var np={ startSeason:v('startSeason'), startYear:parseInt(v('startYear'),10)||2026,
      minCredits:Core.num(v('minCredits')), summerMax:Core.num(v('summerMax'))||12,
      finalLoadMax:Core.num(v('finalLoadMax'))||9, capWindowCredits:Core.num(v('capWindowCredits')), prioritySubjects:v('prioritySubjects'), onePerTermSubjects:v('onePerTermSubjects'), minGPA:Core.num(v('minGPA')), gpaWarn:Core.num(v('gpaWarn')), minRate:Core.num(v('minRate')), rateWarn:Core.num(v('rateWarn')), ipTermOnly:v('ipTermOnly')==='1',
      minGradeForReq:v('minGradeForReq') };
    var changed=JSON.stringify(np)!==JSON.stringify(Object.assign({},S.plannerRules,np)) || Object.keys(np).some(function(k){return S.plannerRules[k]!==np[k];});
    S.plannerRules=Object.assign({},S.plannerRules,np);
    save();
    if(changed && S.plan) regenWithConfirm(); else renderAll();
  }}]});
}

/* ---------------- Borrar todo ---------------- */
function clearAll(){
  modal({title:'Borrar información', narrow:true,
    body:'<div class="checklist"><label><input type="radio" name="clr" value="student" checked><span><strong>Solo el estudiante actual</strong><br><span class="small muted">Nombre, transcript, cursos marcados, plan y selecciones. También sale de la lista de estudiantes.</span></span></label>'+
      '<label><input type="radio" name="clr" value="all"><span><strong>Todo</strong><br><span class="small muted">Además borra la lista de estudiantes guardados, los currículos que cargaste, los cursos agregados y los ajustes. Computer Engineering sigue disponible porque viene incluido.</span></span></label></div>'+
      '<p class="small muted">Esta acción no se puede deshacer.</p>',
    buttons:[{label:'Cancelar'},{label:'Borrar',primary:true,onClick:function(b){
      var all=b.querySelector('input[name=clr]:checked').value==='all';
      if(all){ S=defaultState(); }
      else { if(S.roster) delete S.roster[S.currentId]; S.currentId=Core.uid(); blankStudentFields(); }
      session.pdfData=null; session.editMode=false; session.tab='plan'; save();
      if(curr()) regenerate(true); else renderAll();
      toast(all?'Se borró toda la información.':'Se borró la información del estudiante.');
    }}]});
}

/* ---------------- Nuevo estudiante ---------------- */
function newStudent(){
  modal({title:'Nuevo estudiante', narrow:true, body:'<p style="margin-top:0">Se borrarán el nombre, el transcript, el plan y las selecciones del estudiante actual. Se conservan los currículos y los ajustes.</p>',
    buttons:[{label:'Cancelar'},{label:'Comenzar',primary:true,onClick:function(){
      S.student={name:''}; S.records=[]; S.officialGPA=null; S.transcriptText=''; S.transcriptName='';
      S.plan=null; S.planOriginal=null; S.planEdited=false; S.historyChanged=false; S.electiveSel={}; S.prepExempt={}; S.prevProgram=null;
      session.pdfData=null; session.editMode=false; session.tab='plan'; save();
      if(curr()) regenerate(true); else renderAll();
      var n=$('stName'); if(n) n.focus();
    }}]});
}

/* ---------------- Eventos ---------------- */
function closeMenus(except){ document.querySelectorAll('.menu.open').forEach(function(m){ if(m!==except){ m.classList.remove('open'); var b=m.querySelector('[aria-expanded]'); if(b) b.setAttribute('aria-expanded','false'); } }); }
document.addEventListener('click',function(e){
  var tab=e.target.closest('[data-tab]');
  if(tab){ session.tab=tab.getAttribute('data-tab'); session.editMode=false; renderAll(); return; }
  var btn=e.target.closest('[data-action]');
  if(!btn){ if(!e.target.closest('.menu')) closeMenus(); return; }
  var a=btn.getAttribute('data-action');
  if(a==='menu'){ var m=btn.closest('.menu'); var open=!m.classList.contains('open'); closeMenus(m); m.classList.toggle('open',open); btn.setAttribute('aria-expanded',String(open)); if(open){ var first=m.querySelector('[role=menuitem]'); if(first) first.focus(); } return; }
  closeMenus();
  if(a==='open-transcript') openTranscript();
  else if(a==='open-curriculum') openCurriculum();
  else if(a==='open-audit') openAudit();
  else if(a==='students') openStudents();
  else if(a==='edit-gpa') openGPAEditor();
  else if(a==='gpa-calc'){ setGPAOverride(null); }
  else if(a==='compare') openCompare();
  else if(a==='undo-program') undoProgram();
  else if(a==='hide-prevprog'){ if(S.prevProgram) S.prevProgram.hidden=true; save(); renderPlan(); }
  else if(a==='fastest') openFastest();
  else if(a==='import-audit') pickAuditFile();
  else if(a==='pdf-audit') exportAuditPDF();
  else if(a==='clear-all') clearAll();
  else if(a==='open-settings') openSettings();
  else if(a==='new-student') newStudent();
  else if(a==='regen') regenWithConfirm();
  else if(a==='toggle-edit'){ session.editMode=!session.editMode; renderPlan(); }
  else if(a==='restore') openRestore();
  else if(a==='plan-all'){ S.planTerms=0; save(); renderAll(); }
  else if(a==='electives') openElectives();
  else if(a==='preps') openPreps();
  else if(a==='view-transcript') viewTranscript();
  else if(a==='pdf-plan') exportPlanPDF();
  else if(a==='pdf-transcript') exportTranscriptPDF();
  else if(a==='edit-course') openCourseEditor(btn.closest('tr').getAttribute('data-uid'));
  else if(a==='edit-term') openTermEditor(+btn.closest('.term').getAttribute('data-term'));
  else if(a==='add-course') openAddCourse(+btn.closest('.term').getAttribute('data-term'));
  else if(a==='add-term'){ addNewTerm(); commitEdit(); }
  else if(a==='edit-rec') openRecordEditor(btn.closest('tr').getAttribute('data-rec'));
  else if(a==='add-rec') openRecordEditor(null);
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeMenus(); if(e.key==='Enter' && e.target && e.target.id==='gpaEdit') e.target.blur(); });
document.addEventListener('toggle',function(e){ if(e.target.id==='rulesBox') session.rulesOpen=e.target.open; if(e.target.id==='alertsBox') session.alertsOpen=e.target.open; },true);
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='stName'){ S.student.name=t.value.trim(); save(); return; }
  if(t.id==='stId'){ S.student.id=t.value.trim(); save(); return; }
  if(t.id==='gpaEdit' || t.id==='gpaCalcEdit'){ setGPAFromInput(t); return; }
  if(t.id==='programSel' || t.id==='specSel'){
    if(t.id==='programSel'){ var g=groupByName(t.value); S.programBase=t.value; S.program = g ? g.def : t.value; }
    else { S.program=t.value; S.programBase=baseOf(t.value); }
    S.electiveSel={}; session.editMode=false; save();
    if(curr()) regenerate(true); else { S.plan=null; S.planOriginal=null; save(); renderAll(); }
    return;
  }
  if(t.id==='loadTerms'){ S.planTerms=Core.num(t.value); save(); renderAll(); toast(S.planTerms?'Planificando '+S.planTerms+' trimestre'+(S.planTerms>1?'s':'')+'.':'Plan completo hasta graduarse.'); return; }
  if(t.id==='loadCr' || t.id==='loadCl' || t.id==='loadSu'){
    rememberLoad();
    if(t.id==='loadCr') S.plannerRules.maxCredits=Core.num(t.value); else if(t.id==='loadCl') S.plannerRules.maxCourses=Core.num(t.value); else S.plannerRules.includeSummer=t.value==='1';
    save();
    if(S.planEdited){ S.historyChanged=true; save(); renderAll(); toast('Límite guardado. Regenera el plan para aplicarlo (tiene cambios manuales).'); }
    else { regenerate(true); toast(t.id==='loadSu'?(t.value==='1'?'Summer incluido en el plan.':'Plan sin Summer.'):t.id==='loadCr'?'Máximo de '+t.value+' créditos por término.':(t.value==='0'?'Sin límite de clases por término.':'Máximo de '+t.value+' clases por término.')); }
    return;
  }
  if(t.id==='offGPA'){ var v=t.value.trim(); S.officialGPA=v===''?null:Core.num(v); save(); renderAll(); return; }
  if(t.hasAttribute('data-gpa')){
    var k=t.getAttribute('data-gpa'); S.gpaRules[k]= k==='includePrep' ? t.value==='1' : t.value; save(); renderAll(); return;
  }
});
// Evita que soltar un archivo fuera de un control haga que el navegador abandone la aplicación.
['dragover','drop'].forEach(function(ev){ window.addEventListener(ev,function(e){ e.preventDefault(); }); });

if(fillRecordsFromCurriculum()) save();
// Planes editados a mano guardados antes: se quitan cursos ya aprobados y se colocan electivas escogidas
if(S.plan && S.planEdited && curr()){ var r0=syncPlanWithRecords(); if(r0.removed.length||r0.replaced.length){ save(); setTimeout(function(){ toast('Plan actualizado: '+(r0.removed.length+r0.replaced.length)+' cambio(s) del currículo aplicado(s).'); },400); } }
// Planes guardados antes de la regla "término IP solo con cursos IP"
(function(){
  var mixed=function(pl){ return pl && pl.terms && pl.terms.some(function(t){ var ip=t.courses.some(function(c){return c.grade==='IP'||c.fixed;}); return ip && t.courses.some(function(c){return !(c.grade==='IP'||c.fixed);}); }); };
  if(S.plannerRules.ipTermOnly!==false && mixed(S.plan)){ if(S.planEdited) S.historyChanged=true; else { S.plan=null; S.planOriginal=null; } save(); }
  Object.keys(S.roster||{}).forEach(function(k){ var r=S.roster[k]; if(k!==S.currentId && r && mixed(r.plan)){ if(r.planEdited) r.historyChanged=true; else { r.plan=null; r.planOriginal=null; } } });
})();
if(S._summerRegen){
  delete S._summerRegen;
  var hasSummer=S.plan && S.plan.terms.some(function(t){ return t.season==='Summer'; });
  if(hasSummer){ if(S.planEdited) S.historyChanged=true; else { S.plan=null; S.planOriginal=null; } }
  save();
}
if(S.program && !S.plan && curr()) regenerate(true); else renderAll();
})();
